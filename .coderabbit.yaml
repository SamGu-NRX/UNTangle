# CodeRabbit reads this file from the pull request's head branch. Without base_branches it skips every PR whose
# base isn't the default branch (main) with "Auto reviews are disabled on base/target branches other than the
# default branch". Every UNTangle PR targets alpha or edge, so until 2026-10-15 none was auto-reviewed.
# Drafts are skipped: UNTangle is public, so reviews come from CodeRabbit's free OSS quota, which ran out
# repeatedly on 2026-10-15 ("Review limit reached"). The lead requests "@coderabbitai review" on a draft it needs.
# inheritance: values this file leaves out come from the org and UI settings instead of CodeRabbit's defaults.
inheritance: true
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^alpha$"
      - "^beta$"
      - "^edge$"
