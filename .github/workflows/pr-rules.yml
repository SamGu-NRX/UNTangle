name: PR rules

# Two repository rules, reported as commit statuses on the PR's head commit:
# "Task rule" and "Path ownership". The alpha and main rulesets require both
# (.github/rulesets/). Sam's approving review of the head commit lifts them.
#
# The check jobs check out the PR's base commit and run the scripts and read
# the lists from there, so a PR can't edit the checks that judge it. Nothing
# from the PR is checked out or run: its commits are fetched only so git can
# diff them. They run with read access only, and with no approval input, so a
# base with older scripts runs them as strictly as a new one.
#
# Report reads Sam's reviews, applies the lift, and posts both statuses. A
# status is posted explicitly because the jobs' own checks attach to the
# default branch's commit (GITHUB_SHA for pull_request_target), not the PR's.
#
# Both triggers run this file as it is on the default branch. A review can't
# trigger it directly: pull_request_review runs the copy in the PR's merge
# commit, so a same-repository PR that edited this file could post any status
# it liked once anyone reviewed it. So a review triggers pr-review.yml, which
# has no permissions and does nothing, and its completion (workflow_run)
# triggers this file. The pr job then reads the PR from the API.
on:
  pull_request_target:
    # edited covers a change of base branch; a title edit re-runs harmlessly.
    types: [opened, synchronize, reopened, edited]
    branches: [alpha, main, edge]
  workflow_run:
    workflows: [PR review]
    types: [completed]

permissions:
  contents: read

# The newest event wins. Every run reads the reviews when it reports, so the
# run that survives decides from the latest state.
concurrency:
  # workflow_run lists the PRs whose head branch the review's run used.
  group: pr-rules-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr:
    name: Find the PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.find.outputs.number }}
      base-ref: ${{ steps.find.outputs.base-ref }}
      base-sha: ${{ steps.find.outputs.base-sha }}
      head-sha: ${{ steps.find.outputs.head-sha }}
      head-ref: ${{ steps.find.outputs.head-ref }}
    steps:
      - name: Read the PR from the event or the API
        id: find
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # tools/repo-rules/tests/find-pr.test.ts runs this exact text.
          script: |
            let number = context.payload.pull_request?.number;
            if (number === undefined) {
              // A review's run. Its pull_requests come from GitHub, not from the
              // reviewed PR, so a PR can't point this at another one. A fork's PR
              // has none; pull_request_target covers forks.
              number = context.payload.workflow_run?.pull_requests?.[0]?.number;
              if (number === undefined) {
                core.notice("The review's run names no pull request in this repository, so there is nothing to report.");
                return;
              }
            }
            // Always the PR as it is now, so a review of an older push reports on the current head.
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== "open") {
              core.notice(`#${number} is ${pr.state}, so there is nothing to report.`);
              return;
            }
            core.setOutput("number", String(pr.number));
            core.setOutput("base-ref", pr.base.ref);
            core.setOutput("base-sha", pr.base.sha);
            core.setOutput("head-sha", pr.head.sha);
            core.setOutput("head-ref", pr.head.ref);

  task-rule:
    name: Check the task rule
    needs: pr
    # workflow_run has no branch filter.
    if: contains(fromJSON('["alpha", "main", "edge"]'), needs.pr.outputs.base-ref)
    runs-on: ubuntu-latest
    outputs:
      checked: ${{ steps.tools.outputs.present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # GITHUB_SHA is the default branch's head here, not the PR's base.
          ref: ${{ needs.pr.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Look for the check on the base commit
        id: tools
        run: |
          if [ -f tools/repo-rules/src/check-task-rule.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Task rule not checked::The base commit has no tools/repo-rules/src/check-task-rule.ts, so this PR passes without a check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the PR's commits
        if: steps.tools.outputs.present == 'true'
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
        env:
          PR_NUMBER: ${{ needs.pr.outputs.number }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.tools.outputs.present == 'true'
        with:
          bun-version-file: package.json
      - name: Check the task rule
        if: steps.tools.outputs.present == 'true'
        run: bun --no-env-file tools/repo-rules/src/check-task-rule.ts
        env:
          BASE_SHA: ${{ needs.pr.outputs.base-sha }}
          HEAD_SHA: ${{ needs.pr.outputs.head-sha }}

  path-ownership:
    name: Check path ownership
    needs: pr
    # workflow_run has no branch filter.
    if: contains(fromJSON('["alpha", "main", "edge"]'), needs.pr.outputs.base-ref)
    runs-on: ubuntu-latest
    outputs:
      checked: ${{ steps.tools.outputs.present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # GITHUB_SHA is the default branch's head here, not the PR's base.
          ref: ${{ needs.pr.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Look for the check on the base commit
        id: tools
        run: |
          if [ -f tools/repo-rules/src/check-lead-paths.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Path ownership not checked::The base commit has no tools/repo-rules/src/check-lead-paths.ts, so this PR passes without a check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the PR's commits
        if: steps.tools.outputs.present == 'true'
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
        env:
          PR_NUMBER: ${{ needs.pr.outputs.number }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.tools.outputs.present == 'true'
        with:
          bun-version-file: package.json
      - name: Check lead-owned paths
        if: steps.tools.outputs.present == 'true'
        run: bun --no-env-file tools/repo-rules/src/check-lead-paths.ts
        env:
          BASE_SHA: ${{ needs.pr.outputs.base-sha }}
          HEAD_SHA: ${{ needs.pr.outputs.head-sha }}
          HEAD_REF: ${{ needs.pr.outputs.head-ref }}

  report:
    name: Report
    needs: [pr, task-rule, path-ownership]
    # Reports a failed or skipped check too, so it never leaves a stale status.
    if: ${{ !cancelled() && contains(fromJSON('["alpha", "main", "edge"]'), needs.pr.outputs.base-ref) }}
    runs-on: ubuntu-latest
    # The only job that writes, and it runs nothing from the PR or its base.
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Post each rule's status on the head commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Read from this file, so a PR into alpha or main can't add to it.
          APPROVERS: '["SamGu-NRX"]'
          TASK_RULE_RESULT: ${{ needs.task-rule.result }}
          TASK_RULE_CHECKED: ${{ needs.task-rule.outputs.checked }}
          PATH_OWNERSHIP_RESULT: ${{ needs.path-ownership.result }}
          PATH_OWNERSHIP_CHECKED: ${{ needs.path-ownership.outputs.checked }}
          PR_NUMBER: ${{ needs.pr.outputs.number }}
          HEAD_SHA: ${{ needs.pr.outputs.head-sha }}
        with:
          # The script lives here, not in a file, so the job needs no checkout.
          # tools/repo-rules/tests/report.test.ts runs this exact text.
          script: |
            let approvers;
            try {
              approvers = JSON.parse(process.env.APPROVERS ?? "");
            } catch {
              approvers = undefined;
            }
            if (!Array.isArray(approvers) || approvers.length === 0 || !approvers.every((login) => typeof login === "string" && login !== "")) {
              throw new Error(`APPROVERS must be a non-empty JSON array of GitHub logins, got ${process.env.APPROVERS}`);
            }
            const pr = { number: Number(process.env.PR_NUMBER), head: { sha: process.env.HEAD_SHA ?? "" } };
            if (!Number.isInteger(pr.number) || pr.number <= 0 || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              throw new Error(`The pr job gave no pull request with a head commit (PR_NUMBER=${process.env.PR_NUMBER}, HEAD_SHA=${process.env.HEAD_SHA}).`);
            }
            const { owner, repo } = context.repo;

            // The REST API documents no order for reviews. submitted_at has one-second
            // steps, so ids break ties.
            const newest = (items) =>
              items.toSorted((a, b) => a.submitted_at.localeCompare(b.submitted_at) || a.id - b.id).at(-1);

            // Sam approved this commit when his latest review that approves or blocks is
            // an approval of the PR's head. A later request for changes replaces it, and
            // a dismissed approval reads as DISMISSED. A comment-only review changes
            // nothing, as on GitHub. Reviews belong to one PR, so another PR with the
            // same head is judged on its own reviews.
            function samApproval(reviews) {
              const latest = newest(
                reviews.filter((review) => approvers.includes(review.user?.login) && ["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(review.state)),
              );
              if (latest === undefined) return { approved: false, reason: "Sam hasn't reviewed this PR." };
              if (latest.state === "CHANGES_REQUESTED") return { approved: false, reason: "Sam's latest review requests changes." };
              if (latest.state === "DISMISSED") return { approved: false, reason: "Sam's latest review was dismissed." };
              if (latest.commit_id !== pr.head.sha) return { approved: false, reason: "Sam approved an earlier commit." };
              return { approved: true, reason: "Sam approved this commit." };
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
            const approval = samApproval(reviews);
            core.notice(approval.reason, { title: approval.approved ? "Approved" : "Not approved" });

            const RESULTS = ["success", "failure", "cancelled", "skipped"];
            const rules = [
              { context: "Task rule", result: process.env.TASK_RULE_RESULT, checked: process.env.TASK_RULE_CHECKED },
              { context: "Path ownership", result: process.env.PATH_OWNERSHIP_RESULT, checked: process.env.PATH_OWNERSHIP_CHECKED },
            ];
            const target_url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            for (const rule of rules) {
              if (!RESULTS.includes(rule.result)) throw new Error(`${rule.context}: unknown job result ${JSON.stringify(rule.result)}.`);
              let state;
              let description;
              if (rule.result === "success") {
                if (rule.checked !== "true" && rule.checked !== "false") {
                  throw new Error(`${rule.context}: the job passed without saying whether it ran the check (${JSON.stringify(rule.checked)}).`);
                }
                state = "success";
                description = rule.checked === "true" ? "Passed." : "The base commit has no check to run.";
              } else if (approval.approved) {
                state = "success";
                description = "Sam approved this commit, which lifts this check.";
              } else {
                state = "failure";
                description = rule.result === "failure" ? "Fails. Only Sam's approving review of this commit lifts it." : `The check didn't finish (${rule.result}).`;
              }
              await github.rest.repos.createCommitStatus({ owner, repo, sha: pr.head.sha, context: rule.context, state, description, target_url });
            }
