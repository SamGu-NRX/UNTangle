<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f3">
<title>UNTangle v3: Courses</title>
<style>
/* UNTangle v3 (Opus direction): shared tokens and components for the mockups.
   The token block is the one DESIGN.md specifies; keep the two in step. */
@font-face { font-family: "DM Sans"; src: url("../../../frontend/src/app/fonts/dm-sans-latin-opsz-normal.woff2") format("woff2"); font-weight: 100 1000; font-display: swap; }
@font-face { font-family: "Syne"; src: url("../../../frontend/src/app/fonts/syne-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Syne"; src: url("../../../frontend/src/app/fonts/syne-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-display: swap; }

:root {
  --ground: #f4f6f3; --paper: #ffffff; --paper-2: #eef2ed; --paper-3: #e5ebe4;
  --line: #dde6dc; --line-2: #c5d3c4;
  --ink: #1a2e1a; --ink-2: #4f654f; --ink-3: #6b806b; --ink-4: #9fb09f;
  --brand: #00512b; --brand-2: #007a40; --brand-soft: #e3efe6;
  --accent: #00a855; --accent-soft: #dff5e8;
  --attention: #8a6100; --attention-soft: #fbf3df;
  --danger: #b3261e; --danger-soft: #fbeae8;
  --scrim: rgba(16, 32, 18, .36);
  --glass: rgba(255, 255, 255, .84); --glass-edge: rgba(255, 255, 255, .7);

  --c1: #3f7a4f; --c1t: #e6f0e8; --c2: #a3613f; --c2t: #f6ebe4; --c3: #4b6a8a; --c3t: #e6ecf2;
  --c4: #8d7325; --c4t: #f5f0e0; --c5: #7a5272; --c5t: #f1e8f0; --c6: #3d7a7a; --c6t: #e3f0f0;

  --font-ui: "DM Sans", ui-sans-serif, sans-serif; --font-mark: "Syne", "DM Sans", sans-serif;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(20, 40, 22, .07);
  --shadow-2: 0 6px 16px -4px rgba(20, 40, 22, .12), 0 1px 3px rgba(20, 40, 22, .07);
  --shadow-3: 0 24px 48px -12px rgba(20, 40, 22, .22), 0 4px 10px rgba(20, 40, 22, .08);

  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --ease-camera: cubic-bezier(.19, 1, .22, 1);
  --t-press: 120ms; --t-hover: 160ms; --t-enter: 220ms; --t-exit: 150ms; --t-swap: 160ms;
  --t-move: 300ms; --t-sheet: 340ms; --t-reveal: 420ms; --t-camera: 500ms;

  --topbar-h: 56px; --header-h: 52px; --tabbar-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14px/20px var(--font-ui); font-optical-sizing: auto; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
a { color: var(--brand-2); text-decoration: none; }
input { font: inherit; color: inherit; }
h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 24px; height: 24px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* type */
.wordmark { font: 800 22px/1 var(--font-mark); color: var(--brand); letter-spacing: -.01em; }
.code { font-family: var(--font-mark); font-weight: 700; letter-spacing: .01em; font-variant-numeric: lining-nums; white-space: nowrap; }
.label { font-size: 11px; line-height: 16px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.meta { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.title { font-size: 18px; line-height: 24px; font-weight: 620; letter-spacing: -.005em; }
.h1 { font-size: 28px; line-height: 34px; font-weight: 640; letter-spacing: -.018em; }
.num { font-variant-numeric: tabular-nums; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; position: relative; transition: transform var(--t-press) var(--ease-out), background-color var(--t-hover) ease, color var(--t-hover) ease; }
@media (prefers-reduced-motion: no-preference) { .btn:active { transform: scale(.97); } }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-primary { background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,40,20,.28); }
.btn-secondary { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-1); }
.btn-quiet { color: var(--brand-2); padding: 0 10px; }
.btn-ink { color: var(--ink); padding: 0 10px; }
.btn-lg { height: 52px; padding: 0 22px; font-size: 16px; border-radius: 14px; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn-icon { width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 1; } }
@media (pointer: coarse) { .btn { min-height: 44px; } .btn-sm { min-height: 36px; } .btn-icon, .btn-icon.btn-sm { min-width: 44px; min-height: 44px; }
  .btn-sm::after, .chip::after, .seg > button::after { content: ""; position: absolute; inset: -6px 0; } }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { background: var(--brand-2); }
  .btn-secondary:hover { background: var(--paper-2); }
  .btn-quiet:hover, .btn-ink:hover { background: var(--paper-2); }
}

/* segmented control: one moving pill, segments never animate */
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; height: 36px; background: var(--paper-3); border-radius: 10px; isolation: isolate; }
.seg > button { position: relative; z-index: 1; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg > button[aria-pressed="true"] { color: var(--ink); }
.seg > .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; border-radius: 7px; background: var(--paper); box-shadow: var(--shadow-1), 0 0 0 .5px rgba(20,40,22,.06); transition: transform 220ms var(--ease-out); }
.seg.sm { height: 32px; } .seg.sm > button { font-size: 12.5px; padding: 0 10px; }

/* toggle chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 13px; font-weight: 550; color: var(--ink); white-space: nowrap; position: relative; transition: background-color 120ms ease, color 120ms ease, transform var(--t-press) var(--ease-out); }
@media (prefers-reduced-motion: no-preference) { .chip:active { transform: scale(.97); } }
.chip .i { width: 14px; height: 14px; stroke-width: 2.2; display: none; }
.chip[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }
.chip[aria-pressed="true"] .i { display: block; }
.chip.warn { box-shadow: inset 0 0 0 1.5px var(--attention); color: var(--attention); background: var(--attention-soft); }
@media (hover: hover) and (pointer: fine) { .chip:hover:not([aria-pressed="true"]) { background: var(--paper-2); } }

/* building plate: campus-signage tag; room number follows in body type */
.plate { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; font-size: 13px; color: var(--ink-2); }
.plate b { font: 700 10px/1 var(--font-mark); letter-spacing: .05em; color: #fff; background: var(--brand); padding: 3px 5px 2px; border-radius: 4px; transform: translateY(-1px); }
.plate.quiet b { background: var(--paper-3); color: var(--ink); }

/* provenance tag: once per group, never per row */
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; border: 1px dotted var(--line-2); font-size: 11px; font-weight: 550; color: var(--ink-2); white-space: nowrap; }

/* status glyph (svg symbols s-*) */
.sg { width: 18px; height: 18px; flex: none; }

/* the path line: route styling reused wherever order is real */
.path { position: relative; }
.path > li { position: relative; padding-left: 44px; }
.path { --path-gap: 16px; }
.path > li::before { content: ""; position: absolute; left: 14px; top: 26px; bottom: calc(-1 * var(--path-gap) - 4px); width: 4px; border-radius: 2px; background: var(--brand-2); box-shadow: 0 0 0 2px var(--paper); }
.path > li:last-child::before { display: none; }
.path > li[data-leg="past"]::before { background: var(--ink-4); }
.path > li[data-leg="todo"]::before { background: repeating-linear-gradient(to bottom, var(--ink-4) 0 5px, transparent 5px 9px); box-shadow: none; }
.path .stop { position: absolute; left: 3px; top: 2px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; font: 700 11px/1 var(--font-mark); box-shadow: 0 0 0 2.5px var(--paper), var(--shadow-2); }
.path .stop.past { background: var(--ink-4); }
.path .stop.ring { background: var(--paper); color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--ink-4), 0 0 0 2.5px var(--paper); }
.path .stop.here { background: var(--accent); }
.path .stop svg { width: 14px; height: 14px; stroke-width: 2.4; }

/* desktop top bar */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 20px; padding: 0 20px 0 24px; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); box-shadow: 0 1px 0 var(--line); }
.topbar .search { justify-self: start; display: flex; align-items: center; gap: 10px; width: min(360px, 100%); height: 36px; padding: 0 10px 0 12px; border-radius: 10px; background: var(--paper-2); color: var(--ink-3); font-size: 14px; }
.topbar .search span { flex: 1; text-align: left; color: var(--ink-2); }
.kbd { font: 600 11px/18px var(--font-ui); padding: 0 5px; border-radius: 4px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.sched-pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 650; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); background: var(--paper); }
.sched-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
/* term and schedule name are told apart by weight and color, never by a separator glyph */
.sched-pill .when { font-weight: 500; color: var(--ink-2); }
.sched-pill .i { width: 16px; height: 16px; color: var(--ink-3); margin-right: -4px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font: 700 12px/1 var(--font-mark); }

/* phone header + tab bar */
.pheader { position: sticky; top: 0; z-index: 30; height: calc(var(--header-h) + var(--safe-t)); padding: var(--safe-t) 12px 0 16px; display: flex; align-items: center; gap: 8px; background: rgba(244,246,243,.9); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); }
.pheader .wordmark { font-size: 19px; margin-right: auto; }
.pheader .sched-pill { height: 32px; padding: 0 10px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: calc(var(--tabbar-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(255,255,255,.88); backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px); box-shadow: 0 -1px 0 rgba(26,46,26,.08); }
.tabbar a { display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--ink-2); font-size: 11px; font-weight: 600; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.tabbar a[aria-current="page"] { color: var(--brand); }
.tabbar a[aria-current="page"] .i { stroke-width: 2.1; }
.tabbar .i { width: 24px; height: 24px; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--t-enter) ease; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; height: calc(100dvh - 10px + 40px); margin-bottom: -40px; padding-bottom: 40px; display: flex; flex-direction: column; background: var(--paper); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-3); transform: translateY(110%); will-change: transform; }
.sheet .grabber { flex: none; height: 28px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .grabber::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--line-2); }
.sheet .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet.glass { background: var(--glass); backdrop-filter: saturate(1.7) blur(22px); -webkit-backdrop-filter: saturate(1.7) blur(22px); box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-3); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .sheet.glass, .glass-panel { background: var(--paper); } }
@media (prefers-reduced-transparency: reduce) { .sheet.glass, .glass-panel, .tabbar, .topbar, .pheader { background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; } }
.glass-panel { background: var(--glass); backdrop-filter: saturate(1.7) blur(22px); -webkit-backdrop-filter: saturate(1.7) blur(22px); box-shadow: inset 0 0 0 1px var(--glass-edge), var(--shadow-2); }

/* dialog (centered, origin center) */
.dialog-wrap { position: fixed; inset: 0; z-index: 62; display: grid; place-items: center; padding: 24px; pointer-events: none; }
.dialog { pointer-events: auto; width: min(420px, 100%); background: var(--paper); border-radius: 18px; box-shadow: var(--shadow-3); opacity: 0; transform: scale(.96); transition: opacity var(--t-exit) var(--ease-out), transform var(--t-exit) var(--ease-out); }
.dialog.on { opacity: 1; transform: none; transition-duration: var(--t-enter); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); z-index: 80; display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 14px; box-shadow: var(--shadow-3); opacity: 0; transform: translate(-50%, 8px); transition: opacity var(--t-exit) var(--ease-out), transform var(--t-exit) var(--ease-out); pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); transition-duration: var(--t-enter); pointer-events: auto; }
.toast button { height: 32px; padding: 0 10px; border-radius: 8px; color: #a8e8c4; font-weight: 650; }
.toast .toast-x { display: grid; place-items: center; width: 32px; padding: 0; margin-left: -10px; color: #ffffffb8; }
.toast .toast-x .i { width: 16px; height: 16px; }
@media (hover: hover) and (pointer: fine) { .toast .toast-x:hover { color: #fff; } }
@media (pointer: coarse) { .toast button { position: relative; } .toast button::after { content: ""; position: absolute; inset: -6px 0; } }
@media (max-width: 759px) { .toast { bottom: calc(var(--tabbar-h) + 12px + var(--safe-b)); } }

/* fields */
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.input { height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 15px; outline: none; width: 100%; }
.input::placeholder { color: var(--ink-3); }
.input:focus { box-shadow: inset 0 0 0 1.5px var(--brand-2), 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--danger); }
.help { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.help.err { color: var(--danger); }
@media (pointer: coarse) { .input { font-size: 16px; } }

.searchfield { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--paper-2); color: var(--ink-3); }
.searchfield input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15px; color: var(--ink); }
.searchfield input::placeholder { color: var(--ink-3); }
.searchfield:focus-within { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--brand-2); }
@media (pointer: coarse) { .searchfield input { font-size: 16px; } }

/* toggle switch */
.switch { position: relative; width: 40px; height: 24px; border-radius: 12px; background: var(--line-2); flex: none; transition: background-color var(--t-hover) ease; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: transform 200ms var(--ease-out); }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* course color helpers */
[data-c="1"] { --c: var(--c1); --ct: var(--c1t); } [data-c="2"] { --c: var(--c2); --ct: var(--c2t); }
[data-c="3"] { --c: var(--c3); --ct: var(--c3t); } [data-c="4"] { --c: var(--c4); --ct: var(--c4t); }
[data-c="5"] { --c: var(--c5); --ct: var(--c5t); } [data-c="6"] { --c: var(--c6); --ct: var(--c6t); }
.cdot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

/* One main region plus one contextual panel (simplification rule 2). From 1200px the main region
   sits centered while nothing is selected; opening the panel slides the page left by half the
   panel's width as the panel comes in, so the two never overlap and the selected row stays on
   screen. The page moves by transform only. Under reduced motion the page keeps the open
   position all the time, so it never moves and only the panel fades. Below 1200px the panel
   slides over the right edge. Phones use sheets instead. */
body { overflow-x: clip; }
.pair { display: grid; grid-template-columns: minmax(0, var(--main-max, 720px)) var(--panel-w, 440px); gap: 32px; justify-content: center; align-items: start; padding: 0 24px; }
@media (min-width: 1200px) {
  .pair { transform: translateX(calc((var(--panel-w, 440px) + 32px) / 2)); transition: transform var(--t-exit) var(--ease-out); }
  body.panel-open .pair { transform: none; transition-duration: var(--t-enter); }
  body.panel-instant .pair { transition: none; }
}
@media (min-width: 1200px) and (prefers-reduced-motion: reduce) { .pair, body.panel-open .pair { transform: none; transition: none; } }
.cpanel { position: sticky; top: calc(var(--topbar-h) + 16px); max-height: calc(100dvh - var(--topbar-h) - 32px); display: flex; flex-direction: column; background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--shadow-2); overflow: hidden;
  opacity: 0; transform: translateX(24px); visibility: hidden;
  transition: opacity var(--t-exit) var(--ease-out), transform var(--t-exit) var(--ease-out), visibility 0s linear var(--t-exit); }
.cpanel.on { opacity: 1; transform: none; visibility: visible; transition: opacity var(--t-enter) var(--ease-out), transform var(--t-enter) var(--ease-out), visibility 0s; }
.cpanel.instant, .cpanel.instant.on { transition: none; }
.cpanel .pscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.phd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 16px 12px 12px 20px; background: var(--paper); }
.phd h2 { font-size: 18px; line-height: 24px; font-weight: 620; letter-spacing: -.005em; }
.phd .close { margin-left: auto; }
@media (max-width: 1199px) {
  .pair { grid-template-columns: minmax(0, var(--main-max, 720px)); }
  .cpanel { position: fixed; z-index: 25; top: var(--topbar-h); right: 0; bottom: 0; width: min(var(--panel-w, 440px), 100vw); max-height: none; border-radius: 0; box-shadow: var(--shadow-3); }
}
@media (max-width: 759px) { .pair { display: block; padding: 0; } .cpanel { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .cpanel { transform: none; transition: opacity 120ms ease, visibility 0s linear 120ms; }
  .cpanel.on { transform: none; transition: opacity 120ms ease, visibility 0s; }
}

/* collapsible group header: a plain row, weight and spacing instead of a box */
.ghdr { display: flex; align-items: center; gap: 8px; width: 100%; height: 44px; padding: 0 8px 0 4px; border-radius: 10px; text-align: left; transition: background-color var(--t-hover) ease; }
.ghdr h3 { font-size: 15px; font-weight: 650; }
.ghdr .count { font-size: 13px; color: var(--ink-2); }

    : S === "available" ? `<button class="act" data-add="${code}" aria-label="Add ${code} to Spring 2027">${icon("plus")}</button>` : "<span></span>";
  const meta = inTray ? "" : `<span class="m ${s === "check" ? "att" : ""}">${metaFor(code)}</span>`;
  return `<div class="row" data-key="${inTray ? "t-" : ""}${code}" data-code="${code}" data-s="${S}" data-selected="${selected === code}"><button class="row-hit" aria-label="${code} ${t}, details" aria-current="${selected === code}"></button>${lead}<span class="code">${code}</span><span class="t">${t}</span>${meta}${act}</div>`;
}

/* open groups show their rows, so only collapsed groups carry a count */
const GROUPS = [
  { id: "check", title: "To check", filter: (s) => s === "check", open: true },
  { id: "can", title: "You can take", filter: (s) => s === "available", open: true, sub: true },
  { id: "taking", title: "Taking now", filter: (s) => s === "taking", open: false },
  { id: "later", title: "Later", filter: (s) => s === "locked", open: false, extra: LOCKED_MORE },
  { id: "done", title: "Done", filter: (s) => s === "done" || s === "covered", open: false },
];
const openState = Object.fromEntries(GROUPS.map((g) => [g.id, Q.get("open") === "all" ? true : g.open]));
const plannedCredits = () => [...planned.keys()].reduce((a, c) => a + COURSES[c][1], 0);

function renderTray() {
  const cred = plannedCredits();
  $("#tray").innerHTML = `
    <div class="tray-head"><div><h2 id="trayTitle">Spring 2027</h2><div class="meta"><span id="trayCred">${cred}</span> credits</div></div>
      <button class="btn btn-primary" id="auto" data-i="trayin">Auto</button></div>
    ${planned.size ? `<div id="trayRows">${[...planned.keys()].map((c) => row(c, true)).join("")}</div>
      <div class="tray-link" data-key="tray-link"><a class="btn btn-quiet btn-sm" href="03-schedule-builder.html">Open in Week ${icon("chevR", "sm")}</a></div>`
    : `<div class="tray-empty"><div class="ghosts" id="trayRows"><i></i><i></i><i></i></div><p data-key="tray-empty">Auto fills this term from courses you can take, then picks sections that fit.</p></div>`}`;
  hydrateIcons($("#tray"));
  $("#auto").onclick = runAuto;
}
function renderGroups() {
  const codes = Object.keys(COURSES);
  $("#groups").innerHTML = GROUPS.map((g) => {
    const list = codes.filter((c) => !planned.has(c) && g.filter(COURSES[c][2]));
    const n = list.length + (g.extra || 0);
    if (!n) return "";
    let body = "";
    if (g.sub) { const by = {}; list.forEach((c) => (by[COURSES[c][3]] ||= []).push(c)); body = Object.entries(by).map(([k, v]) => `<div class="sub" data-key="sub-${k}">${k}</div>${v.map((c) => row(c)).join("")}`).join(""); }
    else body = list.map((c) => row(c)).join("");
    if (g.extra) body += `<button class="more" data-key="more-${g.id}" type="button">Show ${g.extra} more</button>`;
    const open = openState[g.id];
    return `<section class="group" id="g-${g.id}" data-key="g-${g.id}" data-open="${open}"><button class="ghdr" data-key="h-${g.id}" type="button" aria-expanded="${open}" data-toggle="${g.id}"><h3>${g.title}</h3>${open ? "" : `<span class="count">${n}</span>`}${icon("chevD", "chev sm")}</button><div class="rows">${body}</div></section>`;
  }).join("");
}
function renderProgress() { $("#prog").textContent = `${DONE_CR + TAKING_CR + plannedCredits()} of 120 credits`; }
const allNodes = () => $$("#main .row, #main .sub, #main .ghdr, #main .more, #tray .tray-link, .tray-empty p");
function renderAll() { renderTray(); renderGroups(); renderProgress(); }

/* Auto: rows travel from the list into the term; the counter rises as each lands */
let lastAuto = null;
async function runAuto() {
  const btn = $("#auto"); const w = btn.offsetWidth;
  btn.style.width = w + "px"; btn.innerHTML = '<span class="spin"></span><span class="sr">Planning</span>'; btn.disabled = true;
  await new Promise((r) => setTimeout(r, 450));
  const picks = PICKS.filter(([c]) => !planned.has(c));
  if (!picks.length) {
    // Everything Auto would pick is already in the term: say so, and offer no Undo that would do nothing.
    btn.disabled = false; btn.style.width = ""; btn.innerHTML = "Auto"; hydrateIcons($("#tray")); btn.focus({ preventScroll: true });
    toast("Spring 2027 already has everything Auto would pick");
    return;
  }
  const before = plannedCredits();
  picks.forEach(([c]) => { const r = $(`.row[data-key="${c}"]`); r && r.classList.add("chosen"); });
  await new Promise((r) => setTimeout(r, 160));
  const from = new Map(picks.map(([c]) => { const r = $(`.row[data-key="${c}"]`); return [c, r ? r.getBoundingClientRect() : null]; }));
  const snaps = new Map(picks.map(([c]) => [c, $(`.row[data-key="${c}"]`)?.cloneNode(true)]));
  lastAuto = picks.map(([c]) => c);
  flip(allNodes, () => { picks.forEach(([c, col, sec]) => planned.set(c, { c: col, sec })); renderAll(); }, { duration: 320, easing: EASE.inOut });
  $("#trayCred").textContent = before;
  $(".tray-head").insertAdjacentHTML("afterend", `<p class="result" id="result" style="opacity:0">Planned ${picks.length} courses<button class="btn btn-quiet" id="undo" data-i="undo" data-is="sm">Undo</button></p>`);
  hydrateIcons($("#result")); $("#undo").onclick = undoAuto;
  let cred = before;
  picks.forEach(([c], i) => {
    const target = $(`.row[data-key="t-${c}"]`); if (!target) return;
    const land = () => { target.style.visibility = ""; cred += COURSES[c][1]; $("#trayCred").textContent = cred; };
    const f = from.get(c), snap = snaps.get(c);
    if (reduced() || !f || !snap) { target.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, delay: i * 30, fill: "backwards" }); land(); return; }
    target.style.visibility = "hidden";
    const to = target.getBoundingClientRect();
    const startY = Math.min(f.top, innerHeight + 8);
    Object.assign(snap.style, { left: f.left + "px", top: startY + "px", width: to.width + "px", height: f.height + "px", margin: 0 });
    snap.classList.add("flyer"); document.body.append(snap);
    const a = snap.animate([{ transform: "translate(0,0)" }, { transform: `translate(${to.left - f.left}px, ${to.top - startY}px)` }], { duration: 420, delay: 80 + i * 55, easing: EASE.inOut, fill: "both" });
    a.onfinish = () => { snap.remove(); land(); };
  });
  setTimeout(() => $("#result")?.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: "forwards" }), 80 + picks.length * 55 + 420);
}
function undoAuto() {
  if (!lastAuto) return;
  const codes = lastAuto; lastAuto = null;
  flip(allNodes, () => { codes.forEach((c) => planned.delete(c)); renderAll(); }, { duration: 260, easing: EASE.inOut, stagger: 0 });
  toast("Spring 2027 is back to how it was");
}

/* one-tap add and remove from rows */
document.addEventListener("click", (e) => {
  const add = e.target.closest("[data-add]"), rm = e.target.closest("[data-rm]");
  if (add) { e.stopPropagation(); const c = add.dataset.add; flip(allNodes, () => { planned.set(c, { c: 2, sec: "" }); renderAll(); }, { duration: 260 }); if (selected) openDetail(selected, true); toast(`Added ${c} to Spring 2027`, "Undo", () => { flip(allNodes, () => { planned.delete(c); renderAll(); }); }); return; }
  if (rm) { e.stopPropagation(); const c = rm.dataset.rm; const prev = planned.get(c); flip(allNodes, () => { planned.delete(c); renderAll(); }, { duration: 260 }); if (selected) openDetail(selected, true); toast(`Removed ${c}`, "Undo", () => flip(allNodes, () => { planned.set(c, prev); renderAll(); })); return; }
  const t = e.target.closest("[data-toggle]");
  if (t) { const g = t.dataset.toggle; openState[g] = !openState[g]; renderGroups(); markSelected(); $(`[data-toggle="${g}"]`).focus(); return; }
  const o = e.target.closest("[data-course]"); if (o) { e.preventDefault(); e.stopPropagation(); openDetail(o.dataset.course, e.detail === 0); return; }
  const r = e.target.closest(".row"); if (r) { openDetail(r.dataset.code, e.detail === 0); return; }
  const v = e.target.closest("[data-href]"); if (v) location.href = v.dataset.href;
  if (e.target.closest('[data-act="major"]')) openMajor();
  if (e.target.closest('[data-act="mclose"]')) closeMajor();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#mwrap").style.display !== "none") closeMajor(); else closeDetail(true); }
  if (selected && (e.key === "ArrowDown" || e.key === "ArrowUp") && !e.target.closest("input")) {
    const rows = $$("#main .row"); const i = rows.findIndex((x) => x.dataset.code === selected);
    const n = rows[i + (e.key === "ArrowDown" ? 1 : -1)]; if (n) { e.preventDefault(); openDetail(n.dataset.code, true); n.querySelector(".row-hit").focus(); }
  }
});

/* detail: a contextual panel on desktop, a sheet on phone */
const seeded = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return () => ((h = (h * 1664525 + 1013904223) >>> 0) / 2 ** 32); };
const SCHED = [["CSCE 2110", 3, [0, 2, 4], 9, 9.83], ["MATH 2700", 1, [0, 2, 4], 10, 10.83], ["PHYS 2220", 4, [0, 2], 11, 11.83], ["CSCE 2610", 6, [1, 3], 12.5, 13.83]];
function sectionsFor(code) {
  if (code === "MATH 3680") return [
    { n: "001", days: [0, 2, 4], s: 10, e: 10.83, d: "MWF 10:00–10:50", who: "A. Okafor", r: 3.8, b: ["CURY", "204"], seats: "18 open", conflict: "Overlaps MATH 2700 on Mon, Wed and Fri" },
    { n: "002", days: [1, 3], s: 9.5, e: 10.83, d: "TR 9:30–10:50", who: "S. Patel", r: 4.4, b: ["GAB", "310"], seats: "6 open" },
    { n: "003", days: [0, 2], s: 14, e: 15.33, d: "MW 2:00–3:20", who: "J. Kim", r: 3.7, b: ["LANG", "114"], seats: "Full, 4 waiting", full: true },
    { n: "900", days: [], d: "Online, no set time", who: "M. Lee", r: 4.0, b: null, seats: "22 open" },
  ];
  const r = seeded(code), b = ["GAB", "LIFE", "CURY", "ESSC", "SAGE"];
  return [0, 1, 2].map((i) => { const tr = r() > 0.5; const s = 8 + Math.floor(r() * 7); return { n: "00" + (i + 1), days: tr ? [1, 3] : [0, 2, 4], s, e: s + (tr ? 1.33 : 0.83), d: `${tr ? "TR" : "MWF"} ${s > 12 ? s - 12 : s}:${tr ? "30" : "00"}`, who: ["H. Wang", "M. Delgado", "R. Shah"][i], r: +(3.4 + r() * 1.3).toFixed(1), b: [b[Math.floor(r() * 5)], String(100 + Math.floor(r() * 400))], seats: Math.floor(r() * 30) + " open" }; });
}
const GRADES = { All: [29, 30, 20, 7, 6, 8, 2.84, "2,318", 41], "A. Okafor": [24, 31, 23, 9, 6, 7, 2.69, "612", 11], "S. Patel": [38, 31, 16, 5, 4, 6, 3.11, "844", 14], "J. Kim": [22, 29, 25, 10, 7, 7, 2.58, "530", 9] };
let instr = "All";
const gradeOf = (n) => { const x = COURSES[n]; if (!x) return ""; if (x[2] === "taking") return "taking now"; if (x[2] === "done") return x[6][1]; if (x[2] === "covered") return x[6].replace("Covered by", "via"); return ""; };
function detailHTML(code) {
  const [t, cr, s, , needs, unlocks, note] = COURSES[code] || [code, 3, "available", "", [], []];
  const S = statusOf(code);
  const statusText = { available: "You can take this", planned: "Planned for Spring 2027", locked: metaFor(code).replace(/<[^>]+>/g, ""), check: note, done: s === "done" ? `Done in ${note[0]} with ${/^[AEIOU]/.test(note[1]) ? "an" : "a"} ${note[1]}` : "", covered: note, taking: "Taking now" }[S];
  const secs = sectionsFor(code);
  const g = GRADES[instr] || GRADES.All;
  const has = (n) => ["done", "covered", "taking"].includes(COURSES[n]?.[2]);
  const noInstr = instr === "All";
  return `
  <header class="dhead"><div class="top"><span class="code">${code}</span><span class="tag">${cr} credits</span><button class="btn btn-ink btn-icon btn-sm close" data-close aria-label="Close" data-i="close"></button></div>
    <h2 tabindex="-1">${t}</h2><span class="dstatus">${sg(S === "planned" ? "planned" : s, LABEL[S])}${statusText}</span></header>
  ${S === "available" || S === "planned" || S === "check" ? `<section class="dsec" style="padding-top:4px"><div class="actions">${S === "available" ? `<button class="btn btn-primary" data-add="${code}" data-i="plus">Add to Spring 2027</button><span class="meta">Auto picks the section, or choose one below.</span>` : S === "planned" ? `<button class="btn btn-secondary" data-rm="${code}" data-i="minus">Remove from Spring 2027</button>` : `<button class="btn btn-secondary">I have approval</button>`}</div></section>` : ""}
  <section class="dsec"><h3>Path</h3>
    <div class="hpath">
      ${needs.map((n) => `<div class="node${has(n) ? "" : " todo"}"><span class="dot">${has(n) ? icon("check") : ""}</span><button class="code" data-course="${n}">${n}</button><span class="meta">${has(n) ? gradeOf(n).replace(/^([A-F])$/, "Grade $1") : "Not yet"}</span></div>`).join("")}
      <div class="node this"><span class="dot"></span><span class="code">${code}</span><span class="meta">This course</span></div>
      ${unlocks.slice(0, 2).map((n) => `<div class="node todo"><span class="dot"></span><button class="code" data-course="${n}">${n}</button><span class="meta">Unlocks</span></div>`).join("")}
    </div>
    ${needs.length ? `<p class="rule">Catalog rule: <b>${needs.join(" and ")}, C or better</b>. ${needs.every(has) ? `<span class="ok">You meet it</span> with ${needs.map((n) => `${n} (${gradeOf(n)})`).join(" and ")}.` : "You don't meet it yet."}</p>` : '<p class="rule">No prerequisites.</p>'}
  </section>
  <section class="dsec"><h3>Sections</h3>
    <div class="mw-days" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div>
    <div class="miniweek" id="mw" aria-hidden="true">${[0, 1, 2, 3, 4].map((d) => `<div>${SCHED.filter((x) => x[2].includes(d)).map((x) => `<i class="blk" data-c="${x[1]}" style="top:${((x[3] - 8) / 9) * 100}%;height:${((x[4] - x[3]) / 9) * 100}%"></i>`).join("")}</div>`).join("")}</div>
    <p class="meta" style="margin-bottom:8px">Your Spring 2027 week. Point at a section to see where it lands.</p>
    ${secs.map((x) => `<div class="sect" data-sec='${JSON.stringify({ days: x.days, s: x.s, e: x.e, bad: !!x.conflict })}'>
      ${planned.get(code)?.sec === `§${x.n}`
        ? `<button class="add on" aria-label="Section ${x.n} is in Spring 2027" data-addsec="${code}|${x.n}">${icon("check")}</button>`
        : `<button class="add ${x.conflict ? "warn" : ""}" ${x.full ? "disabled" : ""} aria-label="${x.full ? "Section full" : `Add section ${x.n}${x.conflict ? ", it overlaps MATH 2700" : ""}`}" data-addsec="${code}|${x.n}">${icon(x.full ? "lock" : "plus")}</button>`}
      <div><div class="l1"><span class="code">§${x.n}</span>${x.d}</div><div class="l2"><span>${x.who}</span><span class="star">${icon("star")}${x.r}</span>${x.b ? `<span class="plate"><b>${x.b[0]}</b>${x.b[1]}</span>` : ""}</div>${x.conflict ? `<div class="conflict">${x.conflict}</div>` : ""}</div>
      <span class="seats ${x.full ? "full" : ""}">${x.seats}</span></div>`).join("")}
    <div class="src"><span class="tag">Sample sections</span>Times and seats are illustrative.</div>
  </section>
  <section class="dsec"><h3>Grades</h3>
    <div class="ipills" id="ipills">${["All", "A. Okafor", "S. Patel", "J. Kim", "M. Lee"].map((n) => `<button class="chip" type="button" aria-pressed="${n === instr}" data-instr="${n}">${n === "All" ? "All instructors" : n}</button>`).join("")}</div>
    ${GRADES[instr] ? "" : `<p class="fallback">No records for ${instr} yet. Showing all instructors.</p>`}
    <div class="figs"><div><b>${g[6]}</b><span>Average GPA</span></div><div><b>${g[7]}</b><span>Students</span></div></div>
    <div class="hbars">${["A", "B", "C", "D", "F", "W"].map((L, i) => `<div class="hbar"><b>${L}</b><div class="track"><div class="fill" style="transform:scaleX(${g[i] / 40})"></div></div><span class="pct">${g[i]}%</span></div>`).join("")}</div>
    <div class="src"><span class="tag">UNT grade records 2019–2025</span>${noInstr ? '<span>Pick an instructor for RateMyProf and syllabi</span>' : `<a href="#">RateMyProf${icon("ext", "sm")}</a><a href="#">Syllabi${icon("ext", "sm")}</a><a href="#">SPOT${icon("ext", "sm")}</a>`}</div>
  </section>
  <section class="dsec"><h3>About</h3><p class="desc" id="desc">Descriptive and inferential statistics for science and engineering: probability models, sampling distributions, estimation, hypothesis testing, regression and analysis of variance, with computing in R. Satisfies the statistics requirement for the Computer Science BS.</p><button class="btn btn-quiet btn-sm" style="margin-left:-10px;margin-top:4px" onclick="this.previousElementSibling.classList.toggle('open');this.textContent=this.textContent==='More'?'Less':'More'">More</button></section>`;
}
const panel = new Panel($("#panel"));
const sheet = new Sheet($("#sheet"), { detents: [() => innerHeight * 0.56, () => innerHeight * 0.92], modal: true, scrim: $("#scrim"), dismissible: true, onDetent: (i) => { if (i < 0) { selected = null; markSelected(); } } });
$("#scrim").onclick = () => closeDetail();
function markSelected() { $$(".row").forEach((r) => { const on = r.dataset.code === selected && !r.dataset.key.startsWith("t-"); r.dataset.selected = on; r.querySelector(".row-hit")?.setAttribute("aria-current", on); }); }
/* Rebuild the open detail in place (its status line and action follow the plan), keeping scroll and focus. */
function refreshDetail(root, focusSelector) {
  const y = root.scrollTop; root.innerHTML = detailHTML(selected); wireDetail(root); root.scrollTop = y;
  if (focusSelector) $(focusSelector, root)?.focus({ preventScroll: true });
}
function wireDetail(root) {
  hydrateIcons(root);
  $$("[data-close]", root).forEach((b) => (b.onclick = (e) => closeDetail(e.detail === 0)));
  $$(".sect", root).forEach((el) => {
    const d = JSON.parse(el.dataset.sec);
    const show = (on) => { $$(".ghost", root).forEach((g) => g.remove()); if (!on || !d.days.length) return; d.days.forEach((day) => { const col = $("#mw", root).children[day]; col.insertAdjacentHTML("beforeend", `<i class="ghost ${d.bad ? "bad" : ""}" style="top:${((d.s - 8) / 9) * 100}%;height:${((d.e - d.s) / 9) * 100}%"></i>`); requestAnimationFrame(() => $$(".ghost", col).forEach((g) => g.classList.add("on"))); }); };
    el.addEventListener("pointerenter", () => FINE.matches && show(true)); el.addEventListener("pointerleave", () => FINE.matches && show(false));
    el.addEventListener("focusin", () => show(true)); el.addEventListener("click", (e) => { if (!e.target.closest(".add")) show(true); });
  });
  $$("[data-addsec]", root).forEach((b) => b.addEventListener("click", (e) => {
    e.stopPropagation(); const [code, n] = b.dataset.addsec.split("|");
    if (planned.get(code)?.sec === `§${n}`) return;
    const clash = b.classList.contains("warn");
    planned.set(code, { c: 2, sec: `§${n}` }); renderAll(); markSelected();
    refreshDetail(root, `[data-addsec="${code}|${n}"]`);
    toast(clash ? `Added ${code} §${n}. It overlaps MATH 2700.` : `Added ${code} §${n}`, "Undo", () => { planned.delete(code); renderAll(); openDetail(code, true); });
  }));
  $$("[data-instr]", root).forEach((c) => c.addEventListener("click", () => { instr = c.dataset.instr; refreshDetail(root, `[data-instr="${instr}"]`); }));
}
function openDetail(code, instant) {
  selected = code; markSelected();
  if (PHONE.matches) { $("#sbody").innerHTML = detailHTML(code); wireDetail($("#sbody")); $("#sbody").scrollTop = 0; if (sheet.index < 0) sheet.open(0); return; }
  $("#pbody").innerHTML = detailHTML(code); wireDetail($("#pbody")); $("#pbody").scrollTop = 0;
  panel.open({ instant });
}
function closeDetail(instant) { selected = null; markSelected(); if (PHONE.matches) { if (sheet.index >= 0) sheet.close(); return; } panel.close(instant); }

/* degree dialog: a search list, not a dropdown */
const MAJORS = [["Computer Science, BS", "CSCE"], ["Computer Engineering, BS", "CENG"], ["Cybersecurity, BS", "CSCE"], ["Data Science, BS", "DTSC"], ["Information Technology, BA", "INFO"], ["Mathematics, BS", "MATH"], ["Biology, BS", "BIOL"], ["Undeclared", ""]];
function renderMajors(q = "") { $("#mlist").innerHTML = MAJORS.filter(([m]) => m.toLowerCase().includes(q.toLowerCase())).map(([m]) => `<button class="mrow" aria-pressed="${m.startsWith("Computer Science")}">${m}</button>`).join("") || '<p class="meta" style="padding:12px">No major matches. Try the department code.</p>'; }
const msheetWrap = $("#mwrap");
function openMajor() { renderMajors(); msheetWrap.style.display = ""; $("#mscrim").classList.add("on"); requestAnimationFrame(() => $("#mdialog").classList.add("on")); if (!$("#cat .pill")) initSeg($("#cat")); modalOpen(msheetWrap, $("#mq")); }
function closeMajor() { $("#mdialog").classList.remove("on"); $("#mscrim").classList.remove("on"); modalClose(msheetWrap); setTimeout(() => (msheetWrap.style.display = "none"), 150); }
$("#mq").addEventListener("input", (e) => renderMajors(e.target.value));
$("#mscrim").onclick = closeMajor;
$("#mlist").addEventListener("click", (e) => { const b = e.target.closest(".mrow"); if (!b) return; $$(".mrow").forEach((x) => x.setAttribute("aria-pressed", x === b)); setTimeout(closeMajor, 120); });

initSeg($("#views"));
/* states */
if (st === "after" || st === "detail") PICKS.forEach(([c, col, sec]) => planned.set(c, { c: col, sec }));
renderAll();
if (st === "detail") openDetail("MATH 3680", true);
if (st === "major") openMajor();
if (st === "imported" && !Q.get("quiet")) setTimeout(() => toast("Added 14 courses from your transcript"), 300);
if (st === "auto-run") setTimeout(runAuto, 400);
</script>
