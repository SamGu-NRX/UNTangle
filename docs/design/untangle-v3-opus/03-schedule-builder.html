<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f3">
<title>UNTangle v3: Week</title>
<style>
/* UNTangle v3 (Opus direction): shared tokens and components for the mockups.
   The token block is the one DESIGN.md specifies; keep the two in step. */
@font-face { font-family: "DM Sans"; src: url("../../../frontend/src/app/fonts/dm-sans-latin-opsz-normal.woff2") format("woff2"); font-weight: 100 1000; font-display: swap; }
@font-face { font-family: "Syne"; src: url("../../../frontend/src/app/fonts/syne-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Syne"; src: url("../../../frontend/src/app/fonts/syne-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-display: swap; }

:root {
  --ground: #f4f6f3; --paper: #ffffff; --paper-2: #eef2ed; --paper-3: #e5ebe4;
  --line: #dde6dc; --line-2: #c5d3c4;
  --ink: #1a2e1a; --ink-2: #4f654f; --ink-3: #6b806b; --ink-4: #9fb09f;
  --brand: #00512b; --brand-2: #007a40; --brand-soft: #e3efe6;
  --accent: #00a855; --accent-soft: #dff5e8;
  --attention: #8a6100; --attention-soft: #fbf3df;
  --danger: #b3261e; --danger-soft: #fbeae8;
  --scrim: rgba(16, 32, 18, .36);
  --glass: rgba(255, 255, 255, .84); --glass-edge: rgba(255, 255, 255, .7);

  --c1: #3f7a4f; --c1t: #e6f0e8; --c2: #a3613f; --c2t: #f6ebe4; --c3: #4b6a8a; --c3t: #e6ecf2;
  --c4: #8d7325; --c4t: #f5f0e0; --c5: #7a5272; --c5t: #f1e8f0; --c6: #3d7a7a; --c6t: #e3f0f0;

  --font-ui: "DM Sans", ui-sans-serif, sans-serif; --font-mark: "Syne", "DM Sans", sans-serif;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(20, 40, 22, .07);
  --shadow-2: 0 6px 16px -4px rgba(20, 40, 22, .12), 0 1px 3px rgba(20, 40, 22, .07);
  --shadow-3: 0 24px 48px -12px rgba(20, 40, 22, .22), 0 4px 10px rgba(20, 40, 22, .08);

  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --ease-camera: cubic-bezier(.19, 1, .22, 1);
  --t-press: 120ms; --t-hover: 160ms; --t-enter: 220ms; --t-exit: 150ms; --t-swap: 160ms;
  --t-move: 300ms; --t-sheet: 340ms; --t-reveal: 420ms; --t-camera: 500ms;

  --topbar-h: 56px; --header-h: 52px; --tabbar-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14px/20px var(--font-ui); font-optical-sizing: auto; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
a { color: var(--brand-2); text-decoration: none; }
input { font: inherit; color: inherit; }
h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 24px; height: 24px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* type */
.wordmark { font: 800 22px/1 var(--font-mark); color: var(--brand); letter-spacing: -.01em; }
.code { font-family: var(--font-mark); font-weight: 700; letter-spacing: .01em; font-variant-numeric: lining-nums; white-space: nowrap; }
.label { font-size: 11px; line-height: 16px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.meta { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.title { font-size: 18px; line-height: 24px; font-weight: 620; letter-spacing: -.005em; }
.h1 { font-size: 28px; line-height: 34px; font-weight: 640; letter-spacing: -.018em; }
.num { font-variant-numeric: tabular-nums; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; position: relative; transition: transform var(--t-press) var(--ease-out), background-color var(--t-hover) ease, color var(--t-hover) ease; }
@media (prefers-reduced-motion: no-preference) { .btn:active { transform: scale(.97); } }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-primary { background: var(--brand); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,40,20,.28); }
.btn-secondary { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-1); }
.btn-quiet { color: var(--brand-2); padding: 0 10px; }
.btn-ink { color: var(--ink); padding: 0 10px; }
.btn-lg { height: 52px; padding: 0 22px; font-size: 16px; border-radius: 14px; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn-icon { width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 1; } }
@media (pointer: coarse) { .btn { min-height: 44px; } .btn-sm { min-height: 36px; } .btn-icon, .btn-icon.btn-sm { min-width: 44px; min-height: 44px; }
  .btn-sm::after, .chip::after, .seg > button::after { content: ""; position: absolute; inset: -6px 0; } }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { background: var(--brand-2); }
  .btn-secondary:hover { background: var(--paper-2); }
  .btn-quiet:hover, .btn-ink:hover { background: var(--paper-2); }
}

/* segmented control: one moving pill, segments never animate */
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; height: 36px; background: var(--paper-3); border-radius: 10px; isolation: isolate; }
.seg > button { position: relative; z-index: 1; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg > button[aria-pressed="true"] { color: var(--ink); }
.seg > .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; border-radius: 7px; background: var(--paper); box-shadow: var(--shadow-1), 0 0 0 .5px rgba(20,40,22,.06); transition: transform 220ms var(--ease-out); }
.seg.sm { height: 32px; } .seg.sm > button { font-size: 12.5px; padding: 0 10px; }

/* toggle chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 13px; font-weight: 550; color: var(--ink); white-space: nowrap; position: relative; transition: background-color 120ms ease, color 120ms ease, transform var(--t-press) var(--ease-out); }
@media (prefers-reduced-motion: no-preference) { .chip:active { transform: scale(.97); } }
.chip .i { width: 14px; height: 14px; stroke-width: 2.2; display: none; }
.chip[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }
.chip[aria-pressed="true"] .i { display: block; }
.chip.warn { box-shadow: inset 0 0 0 1.5px var(--attention); color: var(--attention); background: var(--attention-soft); }
@media (hover: hover) and (pointer: fine) { .chip:hover:not([aria-pressed="true"]) { background: var(--paper-2); } }

/* building plate: campus-signage tag; room number follows in body type */
.plate { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; font-size: 13px; color: var(--ink-2); }
.plate b { font: 700 10px/1 var(--font-mark); letter-spacing: .05em; color: #fff; background: var(--brand); padding: 3px 5px 2px; border-radius: 4px; transform: translateY(-1px); }
.plate.quiet b { background: var(--paper-3); color: var(--ink); }

/* provenance tag: once per group, never per row */
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; border: 1px dotted var(--line-2); font-size: 11px; font-weight: 550; color: var(--ink-2); white-space: nowrap; }

/* status glyph (svg symbols s-*) */
.sg { width: 18px; height: 18px; flex: none; }

/* the path line: route styling reused wherever order is real */
.path { position: relative; }
.path > li { position: relative; padding-left: 44px; }
.path { --path-gap: 16px; }
.path > li::before { content: ""; position: absolute; left: 14px; top: 26px; bottom: calc(-1 * var(--path-gap) - 4px); width: 4px; border-radius: 2px; background: var(--brand-2); box-shadow: 0 0 0 2px var(--paper); }
.path > li:last-child::before { display: none; }
.path > li[data-leg="past"]::before { background: var(--ink-4); }
.path > li[data-leg="todo"]::before { background: repeating-linear-gradient(to bottom, var(--ink-4) 0 5px, transparent 5px 9px); box-shadow: none; }
.path .stop { position: absolute; left: 3px; top: 2px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; font: 700 11px/1 var(--font-mark); box-shadow: 0 0 0 2.5px var(--paper), var(--shadow-2); }
.path .stop.past { background: var(--ink-4); }
.path .stop.ring { background: var(--paper); color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--ink-4), 0 0 0 2.5px var(--paper); }
.path .stop.here { background: var(--accent); }
.path .stop svg { width: 14px; height: 14px; stroke-width: 2.4; }

/* desktop top bar */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 20px; padding: 0 20px 0 24px; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); box-shadow: 0 1px 0 var(--line); }
.topbar .search { justify-self: start; display: flex; align-items: center; gap: 10px; width: min(360px, 100%); height: 36px; padding: 0 10px 0 12px; border-radius: 10px; background: var(--paper-2); color: var(--ink-3); font-size: 14px; }
.topbar .search span { flex: 1; text-align: left; color: var(--ink-2); }
.kbd { font: 600 11px/18px var(--font-ui); padding: 0 5px; border-radius: 4px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.sched-pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 650; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); background: var(--paper); }
.sched-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
/* term and schedule name are told apart by weight and color, never by a separator glyph */
.sched-pill .when { font-weight: 500; color: var(--ink-2); }
.sched-pill .i { width: 16px; height: 16px; color: var(--ink-3); margin-right: -4px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font: 700 12px/1 var(--font-mark); }

/* phone header + tab bar */
.pheader { position: sticky; top: 0; z-index: 30; height: calc(var(--header-h) + var(--safe-t)); padding: var(--safe-t) 12px 0 16px; display: flex; align-items: center; gap: 8px; background: rgba(244,246,243,.9); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); }
.pheader .wordmark { font-size: 19px; margin-right: auto; }
.pheader .sched-pill { height: 32px; padding: 0 10px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: calc(var(--tabbar-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(255,255,255,.88); backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px); box-shadow: 0 -1px 0 rgba(26,46,26,.08); }
.tabbar a { display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--ink-2); font-size: 11px; font-weight: 600; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.tabbar a[aria-current="page"] { color: var(--brand); }
.tabbar a[aria-current="page"] .i { stroke-width: 2.1; }
.tabbar .i { width: 24px; height: 24px; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--t-enter) ease; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; height: calc(100dvh - 10px + 40px); margin-bottom: -40px; padding-bottom: 40px; display: flex; flex-direction: column; background: var(--paper); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-3); transform: translateY(110%); will-change: transform; }
.sheet .grabber { flex: none; height: 28px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .grabber::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--line-2); }
.sheet .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet.glass { background: var(--glass); backdrop-filter: saturate(1.7) blur(22px); -webkit-backdrop-filter: saturate(1.7) blur(22px); box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-3); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .sheet.glass, .glass-panel { background: var(--paper); } }
@media (prefers-reduced-transparency: reduce) { .sheet.glass, .glass-panel, .tabbar, .topbar, .pheader { background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; } }
.glass-panel { background: var(--glass); backdrop-filter: saturate(1.7) blur(22px); -webkit-backdrop-filter: saturate(1.7) blur(22px); box-shadow: inset 0 0 0 1px var(--glass-edge), var(--shadow-2); }

/* dialog (centered, origin center) */
.dialog-wrap { position: fixed; inset: 0; z-index: 62; display: grid; place-items: center; padding: 24px; pointer-events: none; }
.dialog { pointer-events: auto; width: min(420px, 100%); background: var(--paper); border-radius: 18px; box-shadow: var(--shadow-3); opacity: 0; transform: scale(.96); transition: opacity var(--t-exit) var(--ease-out), transform var(--t-exit) var(--ease-out); }
.dialog.on { opacity: 1; transform: none; transition-duration: var(--t-enter); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); z-index: 80; display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 8px 0 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 14px; box-shadow: var(--shadow-3); opacity: 0; transform: translate(-50%, 8px); transition: opacity var(--t-exit) var(--ease-out), transform var(--t-exit) var(--ease-out); pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); transition-duration: var(--t-enter); pointer-events: auto; }
.toast button { height: 32px; padding: 0 10px; border-radius: 8px; color: #a8e8c4; font-weight: 650; }
.toast .toast-x { display: grid; place-items: center; width: 32px; padding: 0; margin-left: -10px; color: #ffffffb8; }
.toast .toast-x .i { width: 16px; height: 16px; }
@media (hover: hover) and (pointer: fine) { .toast .toast-x:hover { color: #fff; } }
@media (pointer: coarse) { .toast button { position: relative; } .toast button::after { content: ""; position: absolute; inset: -6px; } }
@media (max-width: 759px) { .toast { bottom: calc(var(--tabbar-h) + 12px + var(--safe-b)); } }

/* fields */
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.input { height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 15px; outline: none; width: 100%; }
.input::placeholder { color: var(--ink-3); }
.input:focus { box-shadow: inset 0 0 0 1.5px var(--brand-2), 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--danger); }
.help { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.help.err { color: var(--danger); }
@media (pointer: coarse) { .input { font-size: 16px; } }

.searchfield { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--paper-2); color: var(--ink-3); }
.searchfield input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15px; color: var(--ink); }
.searchfield input::placeholder { color: var(--ink-3); }
.searchfield:focus-within { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--brand-2); }
@media (pointer: coarse) { .searchfield input { font-size: 16px; } }

/* toggle switch */
.switch { position: relative; width: 40px; height: 24px; border-radius: 12px; background: var(--line-2); flex: none; transition: background-color var(--t-hover) ease; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: transform 200ms var(--ease-out); }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* course color helpers */
[data-c="1"] { --c: var(--c1); --ct: var(--c1t); } [data-c="2"] { --c: var(--c2); --ct: var(--c2t); }
[data-c="3"] { --c: var(--c3); --ct: var(--c3t); } [data-c="4"] { --c: var(--c4); --ct: var(--c4t); }
[data-c="5"] { --c: var(--c5); --ct: var(--c5t); } [data-c="6"] { --c: var(--c6); --ct: var(--c6t); }
.cdot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

/* One main region plus one contextual panel (simplification rule 2). From 1200px the main region
   sits centered while nothing is selected; opening the panel slides the page left by half the
   panel's width as the panel comes in, so the two never overlap and the selected row stays on
   screen. The page moves by transform only. Under reduced motion the page keeps the open
   position all the time, so it never moves and only the panel fades. Below 1200px the panel
   slides over the right edge. Phones use sheets instead. */
body { overflow-x: clip; }
.pair { display: grid; grid-template-columns: minmax(0, var(--main-max, 720px)) var(--panel-w, 440px); gap: 32px; justify-content: center; align-items: start; padding: 0 24px; }
@media (min-width: 1200px) {
  .pair { transform: translateX(calc((var(--panel-w, 440px) + 32px) / 2)); transition: transform var(--t-exit) var(--ease-out); }
  body.panel-open .pair { transform: none; transition-duration: var(--t-enter); }
  body.panel-instant .pair { transition: none; }
}
@media (min-width: 1200px) and (prefers-reduced-motion: reduce) { .pair, body.panel-open .pair { transform: none; transition: none; } }
.cpanel { position: sticky; top: calc(var(--topbar-h) + 16px); max-height: calc(100dvh - var(--topbar-h) - 32px); display: flex; flex-direction: column; background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--shadow-2); overflow: hidden;
  opacity: 0; transform: translateX(24px); visibility: hidden;
  transition: opacity var(--t-exit) var(--ease-out), transform var(--t-exit) var(--ease-out), visibility 0s linear var(--t-exit); }
.cpanel.on { opacity: 1; transform: none; visibility: visible; transition: opacity var(--t-enter) var(--ease-out), transform var(--t-enter) var(--ease-out), visibility 0s; }
.cpanel.instant, .cpanel.instant.on { transition: none; }
.cpanel .pscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.phd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 16px 12px 12px 20px; background: var(--paper); }
.phd h2 { font-size: 18px; line-height: 24px; font-weight: 620; letter-spacing: -.005em; }
.phd .close { margin-left: auto; }
@media (max-width: 1199px) {
  .pair { grid-template-columns: minmax(0, var(--main-max, 720px)); }
  .cpanel { position: fixed; z-index: 25; top: var(--topbar-h); right: 0; bottom: 0; width: min(var(--panel-w, 440px), 100vw); max-height: none; border-radius: 0; box-shadow: var(--shadow-3); }
}
@media (max-width: 759px) { .pair { display: block; padding: 0; } .cpanel { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .cpanel { transform: none; transition: opacity 120ms ease, visibility 0s linear 120ms; }
  .cpanel.on { transform: none; transition: opacity 120ms ease, visibility 0s; }
}

/* collapsible group header: a plain row, weight and spacing instead of a box */
.ghdr { display: flex; align-items: center; gap: 8px; width: 100%; height: 44px; padding: 0 8px 0 4px; border-radius: 10px; text-align: left; transition: background-color var(--t-hover) ease; }
.ghdr h3 { font-size: 15px; font-weight: 650; }
.ghdr .count { font-size: 13px; color: var(--ink-2); }

const walkMin = (a, b) => (a === b ? 1 : WALK[`${a}|${b}`] || WALK[`${b}|${a}`] || 6);
const BUFFER = 2;

/* preferences: the summary names only what differs from these defaults, which are starting
   values with no data behind them (untangle-v3.md, Placeholders) */
const DEFAULT_PREFS = { start: 0, off: [], lunch: false, walks: true, fewer: false, profs: false, max: 0, busy: [] };
let prefs = { ...DEFAULT_PREFS, start: 9, busy: [{ name: "Work", days: [1, 3], s: 15, e: 17 }] };
function prefSummary() {
  const p = prefs, out = [];
  if (p.off.length) out.push(andList(p.off.map((d) => DAYNAME[d] + "s")) + " off");
  if (p.start) out.push(`nothing before ${p.start} AM`);
  if (p.max) out.push(`${p.max} credits max`);
  if (p.lunch) out.push("a lunch break");
  if (!p.walks) out.push("long walks are fine");
  if (p.fewer) out.push("fewer days on campus");
  if (p.profs) out.push("top-rated professors");
  p.busy.forEach((b) => out.push(`${b.name.toLowerCase()} ${andList(b.days.map((d) => DAYS[d]))} ${fmt(b.s)}–${fmt(b.e)}`));
  const s = out.join(", ");
  return s ? s[0].toUpperCase() + s.slice(1) : "";
}

function meetings(map) {
  const out = [];
  for (const [code, n] of Object.entries(map)) { const s = secOf(code, n); if (!s || s.online) continue; s.days.forEach((d, k) => out.push({ code, n, d, k, s: s.s, e: s.e, b: s.b, c: SECTIONS[code].c })); }
  return out;
}
function conflicts(list) {
  const bad = new Set();
  for (const a of list) for (const b of list) if (a !== b && a.d === b.d && a.code !== b.code && a.s < b.e && b.s < a.e) bad.add(a);
  return bad;
}
/* walks between consecutive classes with a break of 30 minutes or less */
function walks(map) {
  const m = meetings(map), out = [];
  for (let d = 0; d < 5; d++) { const ms = m.filter((x) => x.d === d).sort((a, b) => a.s - b.s); for (let i = 1; i < ms.length; i++) { const gap = Math.round((ms[i].s - ms[i - 1].e) * 60); if (gap > 30 || gap < 0) continue; const w = walkMin(ms[i - 1].b[0], ms[i].b[0]); out.push({ d, to: ms[i].code, from: ms[i - 1], next: ms[i], w, gap, kind: w > gap ? "late" : w + BUFFER >= gap ? "tight" : "" }); } }
  return out;
}
function stats(map) {
  const m = meetings(map); const days = new Set(m.map((x) => x.d)); const ws = walks(map);
  // An empty or online-only week has no first or last class (null), not Math.min of nothing.
  const timed = m.length > 0;
  return { days: days.size, first: timed ? Math.min(...m.map((x) => x.s)) : null, last: timed ? Math.max(...m.map((x) => x.e)) : null, walk: ws.reduce((a, w) => a + w.w, 0), tight: ws.filter((w) => w.kind).length, conf: conflicts(m).size };
}

/* ---------- rendering ---------- */
const H0 = 8; let H1 = 17;
const hh = () => parseFloat(getComputedStyle(document.body).getPropertyValue("--hh"));
let instant = false;
function renderGrid() {
  const map = preview ? preview.map : sched;
  const list = meetings(map);
  H1 = Math.max(17, Math.ceil(Math.max(...list.map((x) => x.e), 0)));
  const H = hh(), rows = H1 - H0;
  $("#ghead").innerHTML = `<span></span>${DAYS.map((d) => `<span>${d}</span>`).join("")}`;
  const bad = conflicts(list);
  const body = $("#gbody");
  const prev = new Map($$(".ev", body).map((e) => [e.dataset.key, e.getBoundingClientRect()]));
  body.style.height = rows * H + "px";
  const hourLabel = (h) => `${h > 12 ? h - 12 : h}${PHONE.matches ? "" : h < 12 ? " AM" : " PM"}`;
  body.innerHTML = `<div class="gutter" aria-hidden="true">${Array.from({ length: rows - 1 }, (_, i) => `<span style="top:${(i + 1) * H}px">${hourLabel(H0 + i + 1)}</span>`).join("")}</div>` +
    DAYS.map((_, d) => `<div class="gday" data-day="${d}"></div>`).join("");
  const cols = $$(".gday", body);
  prefs.busy.forEach((b) => b.days.forEach((d) => cols[d].insertAdjacentHTML("beforeend", `<div class="busy" style="top:${(b.s - H0) * H}px;height:${(b.e - b.s) * H}px">${b.name}</div>`)));
  list.forEach((m) => {
    const sameSlot = list.filter((o) => o.d === m.d && o.s < m.e && m.s < o.e && o !== m);
    const half = sameSlot.length ? (list.indexOf(m) > list.indexOf(sameSlot[0]) ? "half half2" : "half") : "";
    const tall = (m.e - m.s) * H;
    cols[m.d].insertAdjacentHTML("beforeend", `<button class="ev ${bad.has(m) ? "conflict" : ""} ${half}" data-c="${m.c}" data-key="${m.code}-${m.k}" data-code="${m.code}" aria-pressed="${selected === m.code}" style="top:${(m.s - H0) * H + 1}px;height:${tall - 2}px" aria-label="${m.code}, ${DAYNAME[m.d]} ${range(m)}${locked.has(m.code) ? ", section kept" : ""}${bad.has(m) ? ", overlaps another class" : ""}">
      <span class="code">${m.code}</span>${tall > 40 ? `<span class="tm">${range(m)}</span>` : ""}${locked.has(m.code) && !PHONE.matches ? icon("lock", "lk") : ""}</button>`);
  });
  walks(map).forEach((w) => {
    const top = (w.from.e - H0) * H, h = (w.next.s - w.from.e) * H;
    cols[w.d].insertAdjacentHTML("beforeend", `<span class="wline ${w.kind}" style="top:${top}px;height:${h}px"></span><span class="walk ${w.kind}" style="top:${top + h / 2}px" role="img" aria-label="${w.w} minute walk to ${w.to}, ${w.gap} minute break${w.kind ? ", " + w.kind : ""}">${icon("walk")}${w.w}<span class="w">&nbsp;min</span></span>`);
  });
  if (selected && !preview) {
    const cur = map[selected];
    SECTIONS[selected].secs.filter((s) => s.n !== cur && !s.online).forEach((s) => s.days.forEach((d) => {
      const clash = list.some((o) => o.code !== selected && o.d === d && o.s < s.e && s.s < o.e);
      cols[d].insertAdjacentHTML("beforeend", `<button class="opt ${clash ? "bad" : ""}" data-c="${SECTIONS[selected].c}" data-pick="${selected}|${s.n}" style="top:${(s.s - H0) * H + 1}px;height:${(s.e - s.s) * H - 2}px" aria-label="Move ${selected} to ${dayStr(s.days)} ${range(s)}${clash ? ", overlaps another class" : ""}">§${s.n}</button>`);
    }));
  }
  if (ghost) { const s = secOf(ghost.code, ghost.n); if (s && !s.online) s.days.forEach((d) => { const clash = list.some((o) => o.d === d && o.s < s.e && s.s < o.e); cols[d].insertAdjacentHTML("beforeend", `<div class="ghost ${clash ? "bad" : ""}" style="top:${(s.s - H0) * H + 1}px;height:${(s.e - s.s) * H - 2}px">${ghost.code}</div>`); }); }
  $$(".ev", body).forEach((e) => {
    const f = prev.get(e.dataset.key); const l = e.getBoundingClientRect();
    if (!f) { if (prev.size && !instant) e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease-out" }); return; }
    if (reduced() || instant) return;
    const dx = f.left - l.left, dy = f.top - l.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) e.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 300, easing: EASE.inOut });
  });
  const online = Object.entries(map).filter(([c, n]) => secOf(c, n)?.online);
  $("#gfoot").innerHTML = `${online.length ? `<span class="label">No set time</span>${online.map(([c]) => `<span class="pill" data-c="${SECTIONS[c].c}"><span class="code">${c}</span>Online</span>`).join("")}` : ""}<span class="tag">Sample sections</span>`;
  const empty = !Object.keys(map).length;
  $("#empty").hidden = !empty;
  if (empty) { $("#empty").innerHTML = `<div><h2>Add your first course</h2><p class="meta">Search by code, title, instructor or class number.</p><button class="btn btn-primary" data-act="find" data-i="search">Search courses</button><div class="ex"><button class="chip" data-q="CSCE 2110">CSCE 2110</button><button class="chip" data-q="Patel">Patel</button><button class="chip" data-q="23419">23419</button></div></div>`; hydrateIcons($("#empty")); }
}

/* the answer line: a problem the student can fix, a calm verdict, or one alternative */
function renderAnswer() {
  const a = $("#answer");
  if (preview) {
    a.innerHTML = `<div class="alt" role="region" aria-label="Other weeks Auto found"><span class="n" id="altN">${optIndex + 1} of ${OPTIONS.length}${searching ? '<i aria-hidden="true"></i>' : ""}</span><p class="sen" id="altSen" aria-live="polite">${OPTIONS[optIndex].sen}</p>
      <div class="acts"><button class="btn btn-quiet btn-sm" data-act="altdetail">Details</button><button class="btn btn-secondary btn-sm" data-act="next">Next</button><button class="btn btn-primary btn-sm" data-act="useopt">Use this</button><button class="btn btn-ink btn-icon btn-sm" data-act="cancelprev" aria-label="Keep my week" data-i="close"></button></div></div>`;
    hydrateIcons(a); return;
  }
  if (!Object.keys(sched).length) { a.innerHTML = ""; return; }
  const m = meetings(sched), bad = [...conflicts(m)];
  if (bad.length) {
    const x = bad[0], y = m.find((o) => o !== x && o.d === x.d && o.code !== x.code && o.s < x.e && x.s < o.e);
    const days = [...new Set(bad.filter((b) => b.code === x.code).map((b) => DAYNAME[b.d]))];
    a.innerHTML = `<div class="verdict bad">${icon("alert")}<span>${x.code} overlaps ${y.code} on ${andList(days)}.</span><button class="btn btn-secondary btn-sm" data-act="build">Show a fix</button></div>`; return;
  }
  const ws = walks(sched).filter((w) => w.kind);
  if (ws.length) {
    const w = ws[0], days = ws.filter((x) => x.to === w.to).map((x) => DAYNAME[x.d]);
    a.innerHTML = `<div class="verdict warn">${sg("check", "Needs attention")}<span>The walk to ${w.to} on ${andList(days)} is ${w.kind === "late" ? "longer than the break" : "tight"}.</span><button class="btn btn-secondary btn-sm" data-act="build">Show a fix</button></div>`; return;
  }
  a.innerHTML = `<div class="verdict">${sg("planned", "Fits")}<span>This week fits your preferences.</span></div>`;
}

/* section rows: conflicts first, so a clash is visible before the tap */
function secRows(c, m, verb) {
  const S = SECTIONS[c];
  const rows = S.secs.map((s) => { const clash = !s.online && m.find((o) => o.code !== c && s.days.includes(o.d) && o.s < s.e && s.s < o.e); return { s, clash, on: sched[c] === s.n }; });

  return rows.map(({ s, clash, on }) => `<div class="rsec" data-ghost="${c}|${s.n}"><button class="add ${on ? "on" : clash ? "warn" : ""}" ${s.open === 0 && !on ? "disabled" : ""} data-${verb}="${c}|${s.n}" aria-label="${on ? "In your week" : s.open === 0 ? "Full" : (verb === "pick" ? "Move to section " : "Add section ") + s.n + (clash ? ", overlaps " + clash.code : "")}">${icon(on ? "check" : s.open === 0 ? "lock" : "plus")}</button><div><div class="l1"><span class="code">§${s.n}</span>${s.online ? "Online, no set time" : `${dayStr(s.days)} ${range(s)}`}</div><div class="l2">${s.who}${s.b ? `, ${s.b[0]} ${s.b[1]}` : ""}, ${s.open ? s.open + " open" : "full"}</div>${clash ? `<div class="bad">Overlaps ${clash.code} on ${andList(s.days.filter((d) => m.some((o) => o.code === clash.code && o.d === d && o.s < s.e && s.s < o.e)).map((d) => DAYS[d]))}</div>` : ""}</div></div>`).join("");
}

    <div class="psec"><div class="label">Most credits</div><div class="seg sm" id="maxCr" style="width:100%">${[[0, "No limit"], [12, "12"], [15, "15"], [18, "18"]].map(([v, l]) => `<button type="button" aria-pressed="${p.max === v}" data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="psec"><div class="label">Busy times</div>${p.busy.map((b, i) => `<div class="busyrow">${b.name}, ${andList(b.days.map((d) => DAYS[d]))} ${fmt(b.s)}–${fmt(b.e)}<button class="x" aria-label="Remove ${b.name}" data-unbusy="${i}">${icon("close", "sm")}</button></div>`).join("")}<p class="help">Drag across empty time on the grid to add one.</p></div>
    <div class="pacts"><button class="btn btn-quiet btn-sm" style="margin-left:-10px" data-act="resetprefs">Back to defaults</button></div>`;
}
function altHTML() {
  const a = stats(sched), b = stats(OPTIONS[optIndex].map), o = OPTIONS[optIndex];
  const t = (h) => (h === null ? "None" : fmt(h));
  const later = (x, y) => (x === null || y === null ? 0 : y - x); // no class on one side: nothing to compare
  const rows = [["Days on campus", a.days, b.days, b.days - a.days], ["First class", t(a.first), t(b.first), -later(a.first, b.first)], ["Last class ends", t(a.last), t(b.last), later(a.last, b.last)], ["Walking a week", a.walk + " min", b.walk + " min", b.walk - a.walk], ["Tight or late walks", a.tight, b.tight, b.tight - a.tight]];
  const changes = Object.keys(o.map).filter((c) => o.map[c] !== sched[c]);
  const sec = (c, n) => { const s = n && secOf(c, n); return !s ? "Not in your week" : s.online ? "Online" : `${dayStr(s.days)} ${fmt(s.s)}`; };
  return `${panelHead(`Option ${optIndex + 1} next to your week`)}
    <div class="psec"><table class="cmp"><thead><tr><th></th><th>Now</th><th>Option ${optIndex + 1}</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="${r[3] < 0 ? "better" : r[3] > 0 ? "worse" : ""}">${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <div class="psec"><div class="label">Sections that change</div>${changes.map((c) => `<div class="chg" data-c="${SECTIONS[c].c}"><span class="cdot"></span><b class="code" style="font-size:13px">${c}</b><span class="from">${sec(c, sched[c])}</span>${icon("chevR", "sm")}<span>${sec(c, o.map[c])}</span></div>`).join("")}</div>
    <div class="pacts"><button class="btn btn-primary btn-sm" data-act="useopt">Use this</button><button class="btn btn-secondary btn-sm" data-act="saveopt">Save as a new schedule</button></div>`;
}
const panel = new Panel($("#panel"), { onClose: () => { mode = null; selected = null; ghost = null; renderGrid(); renderPrefBtn(); } });
const sheet = new Sheet($("#sheet"), { detents: [() => innerHeight * 0.5, () => innerHeight * 0.92], scrim: null, dismissible: true, onDetent: (i) => { if (i < 0) { mode = null; selected = null; renderGrid(); } } });
function showPanel(m, { code, instant: inst = false, detent = 0, focus = false, trigger } = {}) {
  mode = m;
  const html = m === "find" ? findHTML() : m === "course" ? courseHTML(code) : m === "prefs" ? prefsHTML() : altHTML();
  const host = PHONE.matches ? $("#sbody") : $("#pbody");
  host.innerHTML = html; hydrateIcons(host); wirePanel(host);
  if (PHONE.matches) { sheet.open(detent); } else panel.open({ instant: inst, focus, ...(trigger ? { trigger } : {}) });
  if (m === "find" && !PHONE.matches) requestAnimationFrame(() => $("#q", host)?.focus({ preventScroll: true }));
  renderPrefBtn();
}
function closePanel(inst) { if (PHONE.matches) { if (sheet.index >= 0) sheet.close(); mode = null; selected = null; renderGrid(); return; } panel.close(inst); }
function wirePanel(root) {
  initChips(root, (v, on, c) => {
    if (v === "filters") $("#filters", root).classList.toggle("on", on);
    const g = c.closest("[data-pref]")?.dataset.pref;
    if (g === "off") { const i = +v; prefs.off = on ? [...prefs.off, i].sort() : prefs.off.filter((x) => x !== i); }
    if (g === "flags") prefs[v] = on;
    if (g) prefsChanged();
  });
  $$(".seg", root).forEach((s) => initSeg(s, (v) => { if (s.id === "startAfter") prefs.start = +v; if (s.id === "maxCr") prefs.max = +v; prefsChanged(); }));
  $$(".switch", root).forEach((s) => s.addEventListener("click", () => { const on = s.getAttribute("aria-checked") !== "true"; s.setAttribute("aria-checked", on); const c = s.dataset.lock; if (c) { on ? locked.add(c) : locked.delete(c); renderGrid(); toast(on ? `Auto will keep ${c} where it is` : `Auto may move ${c}`); } }));
  const q = $("#q", root);
  if (q) q.addEventListener("input", () => { query = q.value; expanded = null; $("#results", root).innerHTML = resultsHTML(); hydrateIcons($("#results", root)); });
}
function prefsChanged() {
  renderPrefBtn();
  if (preview) { searching = true; $("#altN") && ($("#altN").innerHTML = `${optIndex + 1} of ${OPTIONS.length}<i aria-hidden="true"></i>`); setTimeout(() => { searching = false; const n = $("#altN"); if (n) n.textContent = `${optIndex + 1} of ${OPTIONS.length}`; }, 600); }
  renderGrid();
}

function renderAll() { renderGrid(); renderAnswer(); renderPrefBtn(); if (mode && mode !== "prefs") { const host = PHONE.matches ? $("#sbody") : $("#pbody"); const y = host.scrollTop; showPanel(mode, { code: selected, instant: true }); host.scrollTop = y; } }

/* ---------- changes, with undo ---------- */
function commit(next, msg) { history.push({ ...sched }); sched = next; SCHEDULES[active] = sched; renderAll(); if (msg) toast(msg, "Undo", () => undo(false)); }
function undo(fromKeyboard) { if (!history.length) return; sched = history.pop(); SCHEDULES[active] = sched; instant = fromKeyboard === true; renderAll(); instant = false; }
$("#undoBtn").onclick = (e) => undo(e.detail === 0);

/* Auto: the best week so far previews within 300ms; the worker keeps looking without moving the grid */
let searching = false;
function build() {
  const btns = $$('[data-act="build"]').filter((b) => b.closest(".whead, .pbar")); btns.forEach((b) => { b.style.width = b.offsetWidth + "px"; b.innerHTML = `<span class="spin"></span><span class="sr">Looking for weeks</span>`; });
  setTimeout(() => {
    btns.forEach((b) => { b.innerHTML = icon("trayin", "sm") + `<span class="buildlbl">${BUILD}</span>`; b.style.width = ""; });
    optIndex = 0; preview = { map: OPTIONS[0].map }; selected = null; searching = true;
    if (mode === "course") closePanel(true);
    renderAll();
    setTimeout(() => { searching = false; const n = $("#altN"); if (n) n.textContent = `${optIndex + 1} of ${OPTIONS.length}`; }, 1200);
  }, 280);
}
/* Next: the sentence crossfades sideways through a 2px blur (110ms out, 160ms in) while events
   move to their new slots (300ms). From the keyboard both change at once. A fast second press
   cancels the first and starts from the new text. */
function showOption(i, fromKeyboard) {
  optIndex = i; preview = { map: OPTIONS[i].map };
  const sen = $("#altSen"), n = $("#altN");
  const apply = () => { sen.textContent = OPTIONS[i].sen; n.firstChild.textContent = `${i + 1} of ${OPTIONS.length}`; };
  sen.getAnimations().forEach((a) => a.cancel());
  if (fromKeyboard) apply();
  else if (reduced()) { apply(); sen.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120 }); }
  else {
    const out = sen.animate([{ opacity: 1, transform: "none", filter: "blur(0)" }, { opacity: 0, transform: "translateX(-4px)", filter: "blur(2px)" }], { duration: 110, easing: EASE.out, fill: "forwards" });
    out.onfinish = () => { apply(); out.cancel(); sen.animate([{ opacity: 0, transform: "translateX(8px)", filter: "blur(2px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 160, easing: EASE.out }); };
  }
  instant = !!fromKeyboard; renderGrid(); instant = false;
  if (mode === "alt") showPanel("alt", { instant: true });
}

/* ---------- schedule switcher (from the pill) ---------- */
let popTrigger = null;
/* the switcher is a popover on desktop and a sheet on phone; picking from it closes whichever is open */
function dismissSwitch(fromKeyboard) { if (PHONE.matches) { if (sheet.index >= 0) sheet.close(); } else closeSwitch(fromKeyboard); }
function openSwitch(trigger, fromKeyboard) {
  if (PHONE.matches) { $("#sbody").innerHTML = `${panelHead("Spring 2027 schedules")}<div class="pop on" style="position:static;width:auto;box-shadow:none;padding:0 10px">${switchItems()}</div>`; hydrateIcons($("#sbody")); wirePanel($("#sbody")); sheet.open(0); return; }
  const p = $("#pop"), r = trigger.getBoundingClientRect();
  p.innerHTML = switchItems(); hydrateIcons(p);
  p.style.top = r.bottom + 8 + "px"; p.style.right = innerWidth - r.right + "px";
  if (fromKeyboard) { p.classList.add("instant"); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove("instant"))); }
  p.classList.add("on"); popTrigger = trigger; trigger.setAttribute("aria-expanded", "true");
  requestAnimationFrame(() => p.querySelector("button")?.focus({ preventScroll: true }));
}
function closeSwitch(fromKeyboard) { const p = $("#pop"); if (!p.classList.contains("on")) return; if (fromKeyboard) { p.classList.add("instant"); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove("instant"))); } p.classList.remove("on"); popTrigger?.setAttribute("aria-expanded", "false"); if (p.contains(document.activeElement)) popTrigger?.focus(); }
function switchItems() {
  const term = HOST === "vsb" && PHONE.matches ? `<div class="seg sm" id="pterm" style="width:100%;margin:4px 0 8px" aria-label="Term"><button type="button">Fall 26</button><button type="button" aria-pressed="true">Spring 27</button><button type="button">Summer 27</button></div>` : "";
  return `${term}<div class="label lab">Spring 2027</div>${Object.keys(SCHEDULES).map((n) => `<button aria-current="${n === active}" data-tab="${n}">${n}${n === active ? `<span class="ck">${icon("check", "sm")}</span>` : ""}</button>`).join("")}<hr><button data-act="newsched">${icon("plus", "sm")}New schedule</button>${HOST === "untangle" ? `<a href="05-schedules-library.html">${icon("compare", "sm")}All schedules and compare</a>` : ""}<button data-act="clear" style="color:var(--danger)">Clear ${active}</button>`;
}

document.addEventListener("click", (e) => {
  if (!e.target.closest("#pop, [data-act='switch']")) closeSwitch();
  const t = e.target.closest("[data-tab],[data-act],[data-exp],[data-addsec],[data-remove],[data-pick],[data-unbusy],.ev,[data-q],[data-href]");
  if (!t) { if (selected && mode === "course" && e.target.closest(".gday")) closePanel(); return; }
  const kb = e.detail === 0;
  if (t.dataset.href) location.href = t.dataset.href;
  if (t.dataset.tab) { dismissSwitch(kb); active = t.dataset.tab; sched = { ...SCHEDULES[active] }; preview = null; selected = null; history = []; if (mode === "course" || mode === "alt") closePanel(true); instant = kb; renderAll(); instant = false; toast(`Showing ${active}`); return; }
  if (t.dataset.q) { query = t.dataset.q; expanded = Object.keys(SECTIONS).find((c) => c === t.dataset.q) || null; showPanel("find", { detent: 1 }); return; }
  if (t.dataset.exp) { expanded = expanded === t.dataset.exp ? null : t.dataset.exp; const r = t.closest(".pscroll, .sheet-body"); $("#results", r).innerHTML = resultsHTML(); hydrateIcons($("#results", r)); $(`[data-exp="${t.dataset.exp}"]`, r)?.focus(); return; }
  if (t.dataset.addsec) { const [c, n] = t.dataset.addsec.split("|"); if (sched[c] === n) return; const clash = t.classList.contains("warn"); ghost = null; commit({ ...sched, [c]: n }, `${sched[c] ? "Moved" : "Added"} ${c} §${n}${clash ? ". It overlaps another class." : ""}`); return; }
  if (t.dataset.remove) { const c = t.dataset.remove; const next = { ...sched }; delete next[c]; closePanel(kb); commit(next, `Removed ${c}`); return; }
  if (t.dataset.pick) { const [c, n] = t.dataset.pick.split("|"); if (sched[c] === n) return; commit({ ...sched, [c]: n }, `Moved ${c} to §${n}`); return; }
  if (t.dataset.unbusy) { prefs.busy.splice(+t.dataset.unbusy, 1); showPanel("prefs", { instant: true }); prefsChanged(); return; }
  if (t.classList.contains("ev")) { if (preview) return; const c = t.dataset.code, k = t.dataset.key; if (selected === c && mode === "course") { closePanel(kb); return; } selected = c; renderGrid(); showPanel("course", { code: c, instant: kb, focus: kb, trigger: () => $(`.ev[data-key="${k}"]`) }); return; }
  const a = t.dataset.act;
  if (a === "build") build();
  else if (a === "find") { if (mode === "find" && !PHONE.matches) { $("#q")?.focus(); return; } showPanel("find", { instant: kb, detent: 1 }); }
  else if (a === "prefs") { if (mode === "prefs") closePanel(kb); else showPanel("prefs", { instant: kb, focus: kb }); }
  else if (a === "pclose") closePanel(kb);

  else if (a === "saveopt") { const name = ["Short walks", "Fridays free", "Tue and Thu"][optIndex]; SCHEDULES[name] = { ...preview.map }; active = name; sched = SCHEDULES[name]; preview = null; closePanel(true); renderAll(); toast(`Saved as “${name}”`); }
  else if (a === "newsched") { dismissSwitch(kb); const name = "Schedule " + (Object.keys(SCHEDULES).length + 1); SCHEDULES[name] = { ...sched }; active = name; renderAll(); toast(`Copied into “${name}”`); }
  else if (a === "clear") { dismissSwitch(kb); instant = kb; commit({}, `Cleared ${active}`); instant = false; }
  else if (a === "switch") { $("#pop").classList.contains("on") ? closeSwitch(kb) : openSwitch(t, kb); }
  else if (a === "resetprefs") { prefs = { ...DEFAULT_PREFS, busy: [] }; showPanel("prefs", { instant: true }); prefsChanged(); }
  else if (a === "export") openExport();
  else if (a === "copynums") toast("Copied 5 class numbers");
});
/* the popover closes when focus leaves it, so Tab never strands it open */
$("#pop").addEventListener("focusout", (e) => { if (!e.relatedTarget || (!$("#pop").contains(e.relatedTarget) && e.relatedTarget !== popTrigger)) closeSwitch(true); });
/* ghost preview while pointing at a section in search results */
document.addEventListener("pointerover", (e) => { const r = e.target.closest(".results [data-ghost]"); if (!r || !FINE.matches) return; const [code, n] = r.dataset.ghost.split("|"); if (ghost && ghost.code === code && ghost.n === n) return; ghost = { code, n }; renderGrid(); });
document.addEventListener("pointerout", (e) => { if (ghost && e.target.closest(".results") && !e.relatedTarget?.closest?.(".results")) { ghost = null; renderGrid(); } });

/* drag an event: it follows the pointer, then snaps to the nearest section of that course */
let drag = null;
$("#gbody").addEventListener("pointerdown", (e) => { const ev = e.target.closest(".ev"); if (!ev || preview || !FINE.matches) return; drag = { ev, code: ev.dataset.code, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId }; });
addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  if (!drag.moved) { drag.moved = true; selected = drag.code; renderGrid(); drag.ev = $(`.ev[data-key="${drag.ev.dataset.key}"]`); drag.ev.classList.add("dragging"); drag.ev.setPointerCapture?.(drag.id); }
  drag.ev.style.transform = `translate(${dx}px, ${dy}px)`;
  const r = drag.ev.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bd = 1e9; $$(".opt").forEach((o) => { const q = o.getBoundingClientRect(); const d = Math.hypot(q.left + q.width / 2 - cx, q.top + q.height / 2 - cy); o.classList.remove("near"); if (d < bd) { bd = d; best = o; } });
  drag.near = bd < 90 ? best : null; if (drag.near) drag.near.classList.add("near");

addEventListener("pointerup", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; if (!d.moved) return;
  if (d.near) { const [c, n] = d.near.dataset.pick.split("|"); d.ev.style.transform = ""; commit({ ...sched, [c]: n }, `Moved ${c} to §${n}`); }
  else { const from = d.ev.style.transform; d.ev.style.transform = ""; if (!reduced()) d.ev.animate([{ transform: from }, { transform: "none" }], { duration: 260, easing: EASE.out }); d.ev.classList.remove("dragging"); }
});
$("#gbody").addEventListener("dblclick", (e) => { if (e.target.classList.contains("gday")) toast("Drag across empty time to block it"); });

/* ---------- export: one set of outputs in both hosts ---------- */
function openExport() {
  const list = Object.entries(sched).map(([c, n]) => ({ c, n, s: secOf(c, n) })).sort((a, b) => a.s.open - b.s.open);
  const html = `<div style="display:flex;align-items:center;margin-bottom:6px"><h2 class="title" id="xtitle">Export ${active}</h2><button class="btn btn-ink btn-icon btn-sm" style="margin-left:auto" data-xclose aria-label="Close">${icon("close")}</button></div>
    <section class="xsec"><h3>${icon("hash")}Class numbers for myUNT</h3><div class="nums">${list.map((x) => `<div><b>${x.s.cls}</b><span>${x.c} §${x.n}</span>${x.s.open < 6 ? "<em>Few seats</em>" : ""}</div>`).join("")}</div><p class="help">Add them to your myUNT cart from the top. The fewest open seats come first.</p><button class="btn btn-primary" data-act="copynums" data-i="copy">Copy all ${list.length}</button></section>
    <section class="xsec"><h3>${icon("calendar")}Calendar file</h3><p class="help">Spring 2027, Jan 19 to May 7. Weekly repeats skip spring break (Mar 15–19). Online classes are left out.</p>${HOST === "untangle" ? `<div class="tline">Leave-by alerts<button class="switch" role="switch" aria-checked="true" aria-label="Leave-by alerts"></button></div>` : ""}<button class="btn btn-secondary" data-i="download">Download .ics</button></section>
    <section class="xsec"><h3>${icon("image")}Picture of the week</h3><button class="btn btn-secondary" data-i="download">Download .png</button></section>
    <section class="xsec"><h3>${icon("share")}Share and back up</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" data-i="copy" data-is="sm">Copy share link</button><button class="btn btn-secondary btn-sm">Print</button><button class="btn btn-secondary btn-sm">Save file</button><button class="btn btn-ink btn-sm">Open a file</button></div></section>`;
  // The same export lands in the phone sheet or the desktop dialog; its switches work in either.
  const wireSwitches = (root) => $$(".switch", root).forEach((s) => (s.onclick = () => s.setAttribute("aria-checked", s.getAttribute("aria-checked") !== "true")));
  if (PHONE.matches) { $("#sbody").innerHTML = `<div style="padding:0 16px">${html}</div>`; hydrateIcons($("#sbody")); wireSwitches($("#sbody")); $("[data-xclose]", $("#sbody")).onclick = () => sheet.close(); sheet.open(1); return; }
  $("#xdialog").innerHTML = html; hydrateIcons($("#xdialog")); wireSwitches($("#xdialog"));
  $("#xwrap").style.display = ""; $("#xscrim").classList.add("on"); requestAnimationFrame(() => $("#xdialog").classList.add("on")); modalOpen($("#xwrap"), $("[data-xclose]", $("#xdialog")));
  $("[data-xclose]", $("#xdialog")).onclick = closeExport;
}
function closeExport() { $("#xdialog").classList.remove("on"); $("#xscrim").classList.remove("on"); modalClose($("#xwrap")); setTimeout(() => ($("#xwrap").style.display = "none"), 150); }
$("#xscrim").onclick = closeExport;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#xwrap").style.display !== "none") closeExport(); else if ($("#pop").classList.contains("on")) closeSwitch(true); else if (PHONE.matches && sheet.index >= 0) closePanel(true); else if (mode) closePanel(true); else if (preview) { preview = null; renderAll(); } }
  if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); undo(true); }
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); showPanel("find", { instant: true, detent: 1 }); }
});

$$(".seg").forEach((s) => (s.id === "views" || s.id === "term") && initSeg(s, (v, b) => { if (b?.dataset.href) location.href = b.dataset.href; }));
addEventListener("resize", () => renderGrid());

/* states */
const st = Q.get("state");
if (st === "conflict") sched = { ...sched, "MATH 3680": "001" };
if (st === "empty") sched = {};
renderAll();
if (st === "choose") { selected = "PHYS 2220"; renderGrid(); showPanel("course", { code: "PHYS 2220", instant: true }); }
if (st === "search") { query = "MATH 3680"; expanded = "MATH 3680"; showPanel("find", { instant: true, detent: 1 }); if (!PHONE.matches) { ghost = { code: "MATH 3680", n: "002" }; renderGrid(); } }
if (st === "options") { preview = { map: OPTIONS[1].map }; optIndex = 1; renderAll(); }
if (st === "optdetail") { preview = { map: OPTIONS[0].map }; optIndex = 0; renderAll(); showPanel("alt", { instant: true }); }
if (st === "prefs") showPanel("prefs", { instant: true });
if (st === "switch") openSwitch($('[data-act="switch"]'), true);
if (st === "export") openExport();
</script>
