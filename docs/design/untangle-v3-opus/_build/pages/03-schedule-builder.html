<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>UNTangle v3: Week</title>
<!--BASE_CSS-->
<style>
  body { --hh: 64px; --gut: 52px; --main-max: 960px; --panel-w: 400px; }
  .pair { padding-top: 20px; padding-bottom: 32px; }

  /* standalone host header */
  .vbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 20px; height: var(--topbar-h); padding: 0 20px 0 24px; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); box-shadow: 0 1px 0 var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 8px; font: 800 19px/1 var(--font-mark); color: var(--ink); letter-spacing: -.01em; white-space: nowrap; }
  .brand .plate b { font-size: 12px; padding: 4px 6px 3px; }
  .vbar .search { display: flex; align-items: center; gap: 10px; width: min(320px, 100%); height: 36px; padding: 0 10px 0 12px; border-radius: 10px; background: var(--paper-2); color: var(--ink-3); font-size: 14px; }
  .vbar .search span { flex: 1; text-align: left; color: var(--ink-2); }
  .vbar .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .fresh { font-size: 13px; color: var(--ink-2); white-space: nowrap; }

  /* week header: one preferences control on the left, actions on the right */
  .whead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .prefbtn { display: inline-flex; align-items: center; gap: 8px; min-width: 0; height: 40px; padding: 0 12px 0 10px; margin-left: -10px; border-radius: 10px; text-align: left; transition: background-color var(--t-hover) ease; }
  .prefbtn b { font-weight: 650; white-space: nowrap; }
  .prefbtn .sum { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .prefbtn .i { color: var(--ink-2); }
  .prefbtn[aria-expanded="true"] { background: var(--brand-soft); }
  @media (hover: hover) and (pointer: fine) { .prefbtn:hover:not([aria-expanded="true"]) { background: rgba(26,46,26,.05); } }
  .whead .right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }

  /* the answer to "is this the best week?": one line, or one alternative at a time */
  .verdict { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 4px; margin-bottom: 8px; font-size: 14px; color: var(--ink-2); }
  .verdict .sg { flex: none; }
  .verdict.warn { color: var(--attention); }
  .verdict.bad { color: var(--danger); }
  .verdict .btn { margin-left: auto; }
  .alt { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 8px 6px 16px; margin-bottom: 8px; border-radius: var(--r-md); background: var(--brand-soft); }
  .alt .n { font-size: 13px; font-weight: 600; color: var(--brand); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .alt .n i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; opacity: .4; }
  .alt .sen { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
  .alt .acts { display: flex; gap: 6px; align-items: center; flex: none; }

  /* grid: one surface, no card around it */
  .gridcard { background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; position: relative; }
  .ghead { display: grid; grid-template-columns: var(--gut) repeat(5, 1fr); height: 36px; align-items: center; }
  .ghead span { font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
  .gbody { position: relative; display: grid; grid-template-columns: var(--gut) repeat(5, 1fr); border-top: 1px solid var(--line); }
  .gutter { position: relative; }
  .gutter span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  .gday { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--hh); }
  .ev { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 6px 8px; background: var(--ct); box-shadow: inset 3px 0 0 var(--c); overflow: hidden; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; z-index: 2; touch-action: manipulation; }
  @media (hover: hover) and (pointer: fine) { .ev { touch-action: none; } }
  .ev .code { font-size: 12px; color: var(--ink); }
  .ev .tm { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .ev[aria-pressed="true"] { box-shadow: inset 3px 0 0 var(--c), 0 0 0 2px var(--c), var(--shadow-2); z-index: 4; }
  .ev.conflict { box-shadow: inset 3px 0 0 var(--danger), 0 0 0 1.5px var(--danger); background: var(--danger-soft); }
  .ev.half { right: auto; width: calc(50% - 6px); } .ev.half2 { left: calc(50% + 2px); }
  .ev .lk { position: absolute; top: 6px; right: 6px; width: 13px; height: 13px; color: var(--ink-2); }
  .ev.dragging { z-index: 6; box-shadow: inset 3px 0 0 var(--c), var(--shadow-3); cursor: grabbing; }
  .opt { position: absolute; left: 4px; right: 4px; border-radius: 8px; border: 1.5px dashed var(--c); background: rgba(255,255,255,.55); z-index: 3; display: grid; place-items: center; font: 700 11px/1 var(--font-mark); color: var(--c); cursor: pointer; transition: background-color var(--t-hover) ease; }
  .opt.near { background: var(--ct); }
  .opt.bad { border-color: var(--danger); color: var(--danger); }
  .ghost { position: absolute; left: 4px; right: 4px; border-radius: 8px; border: 1.5px dashed var(--brand-2); background: rgba(0,122,64,.07); z-index: 5; padding: 6px 8px; font: 700 11px/1.2 var(--font-mark); color: var(--brand-2); opacity: 0; animation: fadeIn 120ms var(--ease-out) forwards; pointer-events: none; }
  .ghost.bad { left: 50%; border-color: var(--danger); color: var(--danger); background: rgba(251,234,232,.94); }
  @keyframes fadeIn { to { opacity: 1; } }
  .busy { position: absolute; left: 0; right: 0; z-index: 1; background: repeating-linear-gradient(135deg, rgba(79,101,79,.1) 0 6px, transparent 6px 12px); font-size: 11px; color: var(--ink-2); padding: 4px 8px; font-weight: 600; }
  /* the drawn walk: a 2px line between consecutive classes, minutes on it */
  .wline { position: absolute; left: 50%; width: 2px; margin-left: -1px; background: var(--brand-2); z-index: 3; pointer-events: none; }
  .wline.tight { background: var(--attention); } .wline.late { background: var(--danger); }
  .walk { position: absolute; left: 50%; transform: translate(-50%, -50%); z-index: 4; display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px 0 5px; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--brand-2); font-size: 11px; font-weight: 650; color: var(--brand); white-space: nowrap; pointer-events: none; }
  .walk .i { width: 12px; height: 12px; }
  .walk.tight { color: var(--attention); box-shadow: 0 0 0 1.5px var(--attention); background: var(--attention-soft); }
  .walk.late { color: var(--danger); box-shadow: 0 0 0 1.5px var(--danger); background: var(--danger-soft); }
  .gfoot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 48px; padding: 8px 12px 8px 16px; border-top: 1px solid var(--line); }
  .gfoot .pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--ct); box-shadow: inset 3px 0 0 var(--c); font-size: 13px; color: var(--ink-2); }
  .gfoot .pill .code { font-size: 12px; color: var(--ink); }
  .gfoot .tag { margin-left: auto; }
  .empty { position: absolute; inset: 36px 0 0 var(--gut); z-index: 6; display: grid; place-items: center; padding: 24px; pointer-events: none; }
  .empty > div { pointer-events: auto; display: grid; gap: 12px; justify-items: center; text-align: center; max-width: 360px; padding: 24px; border-radius: var(--r-lg); background: rgba(255,255,255,.92); }
  .empty h2 { font-size: 20px; font-weight: 650; letter-spacing: -.012em; }
  .empty .ex { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  /* panel contents */
  .psec { padding: 4px 20px 18px; display: grid; gap: 10px; }
  .psec + .psec { border-top: 1px solid var(--line); padding-top: 16px; }
  .psec .label { margin-bottom: -2px; }
  .psec .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .psub { font-size: 13px; color: var(--ink-2); margin: -6px 0 6px; }
  .busyrow { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 10px; background: var(--paper-2); font-size: 14px; }
  .busyrow .x { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-3); }
  .lockrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 14px; font-weight: 600; }
  .lockrow .switch { margin-left: auto; }
  .find { padding: 0 16px 10px; display: grid; gap: 10px; }
  .fchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters { display: none; gap: 10px; }
  .filters.on { display: grid; }
  .results { padding: 0 0 12px; }
  .rhint { padding: 12px 20px; font-size: 14px; color: var(--ink-2); display: grid; gap: 10px; }
  .rhint .ex { display: flex; gap: 6px; flex-wrap: wrap; }
  .rgroup { padding: 8px 20px 4px; }
  .rcourse { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 10px 16px 10px 20px; text-align: left; transition: background-color var(--t-hover) ease; }
  .rcourse .code { font-size: 13px; } .rcourse .t { font-size: 13px; color: var(--ink-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcourse .n { font-size: 12px; color: var(--attention); }
  .rcourse[aria-expanded="true"] { background: var(--paper-2); }
  @media (hover: hover) and (pointer: fine) { .rcourse:hover { background: var(--paper-2); } }
  .rsecs { background: var(--paper-2); padding: 0 12px 8px; }
  .rsec { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; }
  @media (hover: hover) and (pointer: fine) { .rsec:hover { background: var(--paper); } }
  .rsec .add { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--brand); color: #fff; transition: transform var(--t-press) var(--ease-out); }
  @media (prefers-reduced-motion: no-preference) { .rsec .add:active { transform: scale(.94); } }
  .rsec .add.warn { background: var(--paper); color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
  .rsec .add.on { background: var(--brand-soft); color: var(--brand); }
  .rsec .add[disabled] { background: var(--paper-3); color: var(--ink-4); }
  .rsec .l1 { font-size: 13px; font-weight: 600; } .rsec .l1 .code { font-size: 11.5px; color: var(--ink-2); margin-right: 6px; }
  .rsec .l2 { font-size: 12.5px; color: var(--ink-2); }
  .rsec .bad { font-size: 12.5px; color: var(--danger); }
  .cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
  .cmp th { text-align: right; font-size: 12px; font-weight: 650; color: var(--ink-2); padding: 0 0 6px; }
  .cmp th:first-child, .cmp td:first-child { text-align: left; }
  .cmp td { padding: 8px 0; border-top: 1px solid var(--line); text-align: right; }
  .cmp td.better { color: var(--brand); font-weight: 650; } .cmp td.worse { color: var(--attention); font-weight: 650; }
  .chg { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .chg .from { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-4); }
  .pacts { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 20px 20px; }

  /* switcher popover (from the schedule pill) */
  .pop { position: fixed; z-index: 64; width: 280px; padding: 6px; border-radius: 14px; background: var(--paper); box-shadow: var(--shadow-3); transform-origin: top right; opacity: 0; transform: scale(.97); visibility: hidden; transition: opacity var(--t-exit) var(--ease-out), transform var(--t-exit) var(--ease-out), visibility 0s linear var(--t-exit); }
  .pop.on { opacity: 1; transform: none; visibility: visible; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out), visibility 0s; }
  .pop .lab { padding: 8px 10px 4px; }
  .pop button, .pop a { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: var(--ink); text-align: left; }
  .pop .ck { margin-left: auto; color: var(--brand); }
  .pop hr { border: 0; height: 1px; background: var(--line); margin: 6px 4px; }
  @media (hover: hover) and (pointer: fine) { .pop button:hover, .pop a:hover { background: var(--paper-2); } }
  @media (prefers-reduced-motion: reduce) { .pop, .pop.on { transform: none; transition: opacity 120ms ease, visibility 0s linear 120ms; } .pop.on { transition: opacity 120ms ease, visibility 0s; } }
  .pop.instant, .pop.instant.on { transition: none; }

  /* export */
  .xsec { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .xsec:first-of-type { border-top: 0; padding-top: 4px; }
  .xsec h3 { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 650; }
  .xsec h3 .i { color: var(--brand-2); }
  .nums { font: 500 13px/1.9 var(--font-ui); background: var(--paper-2); border-radius: 10px; padding: 8px 12px; }
  .nums div { display: flex; gap: 12px; } .nums b { font-weight: 650; width: 52px; } .nums span { color: var(--ink-2); } .nums em { margin-left: auto; font-style: normal; color: var(--attention); }
  .tline { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .tline .switch { margin-left: auto; }

  .pbar { display: none; }
  @media (pointer: coarse) { .prefbtn { min-height: 44px; } .rcourse { min-height: 48px; } }
  .sheet .sheet-body { padding: 0 0 24px; }
  @media (max-width: 1023px) { .fresh { display: none; } }
  @media (max-width: 759px) {
    body { --hh: 52px; --gut: 30px; }
    .pair { padding: 4px 8px calc(var(--tabbar-h) + 84px + var(--safe-b)); }
    body.host-vsb .pair { padding-bottom: calc(96px + var(--safe-b)); }
    .vbar { padding: var(--safe-t) 12px 0 16px; height: calc(52px + var(--safe-t)); gap: 8px; }
    .brand { font-size: 16px; } .brand .plate b { font-size: 10px; }
    .whead { margin: 0 4px 4px; } .prefbtn { margin-left: -6px; flex: 1; } .prefbtn b { display: none; }
    .whead .right .lbl { display: none; }
    .verdict { font-size: 13.5px; min-height: 40px; padding: 0 6px; }
    .alt { flex-wrap: wrap; padding: 10px 10px 10px 14px; gap: 6px 10px; } .alt .sen { flex-basis: calc(100% - 60px); order: 2; } .alt .acts { order: 3; width: 100%; } .alt .acts .btn { flex: 1; } .alt .acts .btn-icon { flex: none; }
    .gridcard { border-radius: 14px; }
    .ghead { height: 30px; } .ghead span { font-size: 11px; }
    .gutter span { right: 4px; font-size: 10px; }
    .ev { left: 2px; right: 2px; padding: 4px; border-radius: 6px; }
    .ev .code { font-size: 10.5px; line-height: 12px; white-space: normal; }
    .ev .tm { display: none; }
    .walk { height: 16px; font-size: 10px; padding: 0 5px 0 3px; } .walk .i { width: 10px; height: 10px; } .walk .w { display: none; }
    .gfoot .tag { display: none; }
    .pbar { position: fixed; left: 8px; right: 8px; bottom: calc(var(--tabbar-h) + 8px + var(--safe-b)); z-index: 35; display: flex; gap: 8px; padding: 8px; border-radius: 16px; }
    body.host-vsb .pbar { bottom: calc(10px + var(--safe-b)); }
    .pbar .btn { flex: 1; height: 44px; padding: 0 10px; }
  }
</style>
</head>

<script>
const HOST = Q.get("host") === "vsb" ? "vsb" : "untangle";
document.body.classList.add("host-" + HOST);
$$(HOST === "vsb" ? ".host-untangle-only" : ".host-vsb-only").forEach((el) => el.remove());
const BUILD = HOST === "vsb" ? (PHONE.matches ? "Build" : "Build my schedule") : "Auto";
$$(".buildlbl").forEach((el) => (el.textContent = BUILD));
document.title = HOST === "vsb" ? "UNT Schedule Builder (v2 mockup)" : document.title;

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"], DAYNAME = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const fmt = (h) => { const m = Math.round(h * 60), hh = Math.floor(m / 60), mm = m % 60; return `${hh > 12 ? hh - 12 : hh}:${String(mm).padStart(2, "0")}`; };
const range = (s) => `${fmt(s.s)}–${fmt(s.e)}`;
const dayStr = (d) => d.map((i) => "MTWRF"[i]).join("");
const andList = (a) => (a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]);
/* every section the mockup knows; color is per course, clustered by department */
const SECTIONS = {
  "CSCE 2110": { t: "Foundations of Data Structures", cr: 3, c: 3, secs: [
    { n: "001", days: [0, 2, 4], s: 9, e: 9.83, b: ["GAB", "535"], who: "H. Wang", cls: "21843", open: 12 },
    { n: "002", days: [1, 3], s: 9.5, e: 10.83, b: ["NTDP", "B185"], who: "M. Delgado", cls: "21844", open: 3 },

/* preferences: the summary names only what differs from these defaults, which are starting

const DEFAULT_PREFS = { start: 0, off: [], lunch: false, walks: true, fewer: false, profs: false, max: 0, busy: [] };
let prefs = { ...DEFAULT_PREFS, start: 9, busy: [{ name: "Work", days: [1, 3], s: 15, e: 17 }] };
function prefSummary() {
  const p = prefs, out = [];
  if (p.off.length) out.push(andList(p.off.map((d) => DAYNAME[d] + "s")) + " off");
  if (p.start) out.push(`nothing before ${p.start} AM`);
  if (p.max) out.push(`${p.max} credits max`);
  if (p.lunch) out.push("a lunch break");
  if (!p.walks) out.push("long walks are fine");
  if (p.fewer) out.push("fewer days on campus");
  if (p.profs) out.push("top-rated professors");
  p.busy.forEach((b) => out.push(`${b.name.toLowerCase()} ${andList(b.days.map((d) => DAYS[d]))} ${fmt(b.s)}–${fmt(b.e)}`));
  const s = out.join(", ");
  return s ? s[0].toUpperCase() + s.slice(1) : "";
}

function meetings(map) {
  const out = [];
  for (const [code, n] of Object.entries(map)) { const s = secOf(code, n); if (!s || s.online) continue; s.days.forEach((d, k) => out.push({ code, n, d, k, s: s.s, e: s.e, b: s.b, c: SECTIONS[code].c })); }
  return out;
}
function conflicts(list) {
  const bad = new Set();
  for (const a of list) for (const b of list) if (a !== b && a.d === b.d && a.code !== b.code && a.s < b.e && b.s < a.e) bad.add(a);
  return bad;
}
/* walks between consecutive classes with a break of 30 minutes or less */
function walks(map) {
  const m = meetings(map), out = [];
  for (let d = 0; d < 5; d++) { const ms = m.filter((x) => x.d === d).sort((a, b) => a.s - b.s); for (let i = 1; i < ms.length; i++) { const gap = Math.round((ms[i].s - ms[i - 1].e) * 60); if (gap > 30 || gap < 0) continue; const w = walkMin(ms[i - 1].b[0], ms[i].b[0]); out.push({ d, to: ms[i].code, from: ms[i - 1], next: ms[i], w, gap, kind: w > gap ? "late" : w + BUFFER >= gap ? "tight" : "" }); } }
  return out;
}
function stats(map) {
  const m = meetings(map); const days = new Set(m.map((x) => x.d)); const ws = walks(map);
  // An empty or online-only week has no first or last class (null), not Math.min of nothing.
  const timed = m.length > 0;
  return { days: days.size, first: timed ? Math.min(...m.map((x) => x.s)) : null, last: timed ? Math.max(...m.map((x) => x.e)) : null, walk: ws.reduce((a, w) => a + w.w, 0), tight: ws.filter((w) => w.kind).length, conf: conflicts(m).size };
}

/* ---------- rendering ---------- */
const H0 = 8; let H1 = 17;
const hh = () => parseFloat(getComputedStyle(document.body).getPropertyValue("--hh"));
let instant = false;
function renderGrid() {
  const map = preview ? preview.map : sched;

  list.forEach((m) => {
    const sameSlot = list.filter((o) => o.d === m.d && o.s < m.e && m.s < o.e && o !== m);
    const half = sameSlot.length ? (list.indexOf(m) > list.indexOf(sameSlot[0]) ? "half half2" : "half") : "";

      <span class="code">${m.code}</span>${tall > 40 ? `<span class="tm">${range(m)}</span>` : ""}${locked.has(m.code) && !PHONE.matches ? icon("lock", "lk") : ""}</button>`);
  });

      const clash = list.some((o) => o.code !== selected && o.d === d && o.s < s.e && s.s < o.e);
      cols[d].insertAdjacentHTML("beforeend", `<button class="opt ${clash ? "bad" : ""}" data-c="${SECTIONS[selected].c}" data-pick="${selected}|${s.n}" style="top:${(s.s - H0) * H + 1}px;height:${(s.e - s.s) * H - 2}px" aria-label="Move ${selected} to ${dayStr(s.days)} ${range(s)}${clash ? ", overlaps another class" : ""}">§${s.n}</button>`);

}

  const a = stats(sched), b = stats(OPTIONS[optIndex].map), o = OPTIONS[optIndex];
  const t = (h) => (h === null ? "None" : fmt(h));
  const later = (x, y) => (x === null || y === null ? 0 : y - x); // no class on one side: nothing to compare
  const rows = [["Days on campus", a.days, b.days, b.days - a.days], ["First class", t(a.first), t(b.first), -later(a.first, b.first)], ["Last class ends", t(a.last), t(b.last), later(a.last, b.last)], ["Walking a week", a.walk + " min", b.walk + " min", b.walk - a.walk], ["Tight or late walks", a.tight, b.tight, b.tight - a.tight]];
  const changes = Object.keys(o.map).filter((c) => o.map[c] !== sched[c]);
  const sec = (c, n) => { const s = n && secOf(c, n); return !s ? "Not in your week" : s.online ? "Online" : `${dayStr(s.days)} ${fmt(s.s)}`; };
  return `${panelHead(`Option ${optIndex + 1} next to your week`)}
    <div class="psec"><table class="cmp"><thead><tr><th></th><th>Now</th><th>Option ${optIndex + 1}</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="${r[3] < 0 ? "better" : r[3] > 0 ? "worse" : ""}">${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <div class="psec"><div class="label">Sections that change</div>${changes.map((c) => `<div class="chg" data-c="${SECTIONS[c].c}"><span class="cdot"></span><b class="code" style="font-size:13px">${c}</b><span class="from">${sec(c, sched[c])}</span>${icon("chevR", "sm")}<span>${sec(c, o.map[c])}</span></div>`).join("")}</div>
    <div class="pacts"><button class="btn btn-primary btn-sm" data-act="useopt">Use this</button><button class="btn btn-secondary btn-sm" data-act="saveopt">Save as a new schedule</button></div>`;
}
const panel = new Panel($("#panel"), { onClose: () => { mode = null; selected = null; ghost = null; renderGrid(); renderPrefBtn(); } });
const sheet = new Sheet($("#sheet"), { detents: [() => innerHeight * 0.5, () => innerHeight * 0.92], scrim: null, dismissible: true, onDetent: (i) => { if (i < 0) { mode = null; selected = null; renderGrid(); } } });
function showPanel(m, { code, instant: inst = false, detent = 0, focus = false, trigger } = {}) {
  mode = m;
  const html = m === "find" ? findHTML() : m === "course" ? courseHTML(code) : m === "prefs" ? prefsHTML() : altHTML();
  const host = PHONE.matches ? $("#sbody") : $("#pbody");
  host.innerHTML = html; hydrateIcons(host); wirePanel(host);
  if (PHONE.matches) { sheet.open(detent); } else panel.open({ instant: inst, focus, ...(trigger ? { trigger } : {}) });
  if (m === "find" && !PHONE.matches) requestAnimationFrame(() => $("#q", host)?.focus({ preventScroll: true }));
  renderPrefBtn();
}
function closePanel(inst) { if (PHONE.matches) { if (sheet.index >= 0) sheet.close(); mode = null; selected = null; renderGrid(); return; } panel.close(inst); }
function wirePanel(root) {
  initChips(root, (v, on, c) => {
    if (v === "filters") $("#filters", root).classList.toggle("on", on);
    const g = c.closest("[data-pref]")?.dataset.pref;
    if (g === "off") { const i = +v; prefs.off = on ? [...prefs.off, i].sort() : prefs.off.filter((x) => x !== i); }
    if (g === "flags") prefs[v] = on;
    if (g) prefsChanged();
  });
  $$(".seg", root).forEach((s) => initSeg(s, (v) => { if (s.id === "startAfter") prefs.start = +v; if (s.id === "maxCr") prefs.max = +v; prefsChanged(); }));
  $$(".switch", root).forEach((s) => s.addEventListener("click", () => { const on = s.getAttribute("aria-checked") !== "true"; s.setAttribute("aria-checked", on); const c = s.dataset.lock; if (c) { on ? locked.add(c) : locked.delete(c); renderGrid(); toast(on ? `Auto will keep ${c} where it is` : `Auto may move ${c}`); } }));
  const q = $("#q", root);
  if (q) q.addEventListener("input", () => { query = q.value; expanded = null; $("#results", root).innerHTML = resultsHTML(); hydrateIcons($("#results", root)); });
}
function prefsChanged() {
  renderPrefBtn();
  if (preview) { searching = true; $("#altN") && ($("#altN").innerHTML = `${optIndex + 1} of ${OPTIONS.length}<i aria-hidden="true"></i>`); setTimeout(() => { searching = false; const n = $("#altN"); if (n) n.textContent = `${optIndex + 1} of ${OPTIONS.length}`; }, 600); }
  renderGrid();
}

function renderAll() { renderGrid(); renderAnswer(); renderPrefBtn(); if (mode && mode !== "prefs") { const host = PHONE.matches ? $("#sbody") : $("#pbody"); const y = host.scrollTop; showPanel(mode, { code: selected, instant: true }); host.scrollTop = y; } }

/* ---------- changes, with undo ---------- */
function commit(next, msg) { history.push({ ...sched }); sched = next; SCHEDULES[active] = sched; renderAll(); if (msg) toast(msg, "Undo", () => undo(false)); }
function undo(fromKeyboard) { if (!history.length) return; sched = history.pop(); SCHEDULES[active] = sched; instant = fromKeyboard === true; renderAll(); instant = false; }
$("#undoBtn").onclick = (e) => undo(e.detail === 0);

/* Auto: the best week so far previews within 300ms; the worker keeps looking without moving the grid */
let searching = false;
function build() {
  const btns = $$('[data-act="build"]').filter((b) => b.closest(".whead, .pbar")); btns.forEach((b) => { b.style.width = b.offsetWidth + "px"; b.innerHTML = `<span class="spin"></span><span class="sr">Looking for weeks</span>`; });
  setTimeout(() => {
    btns.forEach((b) => { b.innerHTML = icon("trayin", "sm") + `<span class="buildlbl">${BUILD}</span>`; b.style.width = ""; });
    optIndex = 0; preview = { map: OPTIONS[0].map }; selected = null; searching = true;
    if (mode === "course") closePanel(true);
    renderAll();
    setTimeout(() => { searching = false; const n = $("#altN"); if (n) n.textContent = `${optIndex + 1} of ${OPTIONS.length}`; }, 1200);
  }, 280);
}
/* Next: the sentence crossfades sideways through a 2px blur (110ms out, 160ms in) while events
   move to their new slots (300ms). From the keyboard both change at once. A fast second press
   cancels the first and starts from the new text. */
function showOption(i, fromKeyboard) {
  optIndex = i; preview = { map: OPTIONS[i].map };
  const sen = $("#altSen"), n = $("#altN");
  const apply = () => { sen.textContent = OPTIONS[i].sen; n.firstChild.textContent = `${i + 1} of ${OPTIONS.length}`; };
  sen.getAnimations().forEach((a) => a.cancel());
  if (fromKeyboard) apply();
  else if (reduced()) { apply(); sen.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120 }); }
  else {
    const out = sen.animate([{ opacity: 1, transform: "none", filter: "blur(0)" }, { opacity: 0, transform: "translateX(-4px)", filter: "blur(2px)" }], { duration: 110, easing: EASE.out, fill: "forwards" });
    out.onfinish = () => { apply(); out.cancel(); sen.animate([{ opacity: 0, transform: "translateX(8px)", filter: "blur(2px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 160, easing: EASE.out }); };
  }
  instant = !!fromKeyboard; renderGrid(); instant = false;
  if (mode === "alt") showPanel("alt", { instant: true });
}

/* ---------- schedule switcher (from the pill) ---------- */
let popTrigger = null;
/* the switcher is a popover on desktop and a sheet on phone; picking from it closes whichever is open */
function dismissSwitch(fromKeyboard) { if (PHONE.matches) { if (sheet.index >= 0) sheet.close(); } else closeSwitch(fromKeyboard); }
function openSwitch(trigger, fromKeyboard) {
  if (PHONE.matches) { $("#sbody").innerHTML = `${panelHead("Spring 2027 schedules")}<div class="pop on" style="position:static;width:auto;box-shadow:none;padding:0 10px">${switchItems()}</div>`; hydrateIcons($("#sbody")); wirePanel($("#sbody")); sheet.open(0); return; }
  const p = $("#pop"), r = trigger.getBoundingClientRect();
  p.innerHTML = switchItems(); hydrateIcons(p);
  p.style.top = r.bottom + 8 + "px"; p.style.right = innerWidth - r.right + "px";
  if (fromKeyboard) { p.classList.add("instant"); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove("instant"))); }
  p.classList.add("on"); popTrigger = trigger; trigger.setAttribute("aria-expanded", "true");
  requestAnimationFrame(() => p.querySelector("button")?.focus({ preventScroll: true }));
}
function closeSwitch(fromKeyboard) { const p = $("#pop"); if (!p.classList.contains("on")) return; if (fromKeyboard) { p.classList.add("instant"); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove("instant"))); } p.classList.remove("on"); popTrigger?.setAttribute("aria-expanded", "false"); if (p.contains(document.activeElement)) popTrigger?.focus(); }
function switchItems() {
  const term = HOST === "vsb" && PHONE.matches ? `<div class="seg sm" id="pterm" style="width:100%;margin:4px 0 8px" aria-label="Term"><button type="button">Fall 26</button><button type="button" aria-pressed="true">Spring 27</button><button type="button">Summer 27</button></div>` : "";
  return `${term}<div class="label lab">Spring 2027</div>${Object.keys(SCHEDULES).map((n) => `<button aria-current="${n === active}" data-tab="${n}">${n}${n === active ? `<span class="ck">${icon("check", "sm")}</span>` : ""}</button>`).join("")}<hr><button data-act="newsched">${icon("plus", "sm")}New schedule</button>${HOST === "untangle" ? `<a href="05-schedules-library.html">${icon("compare", "sm")}All schedules and compare</a>` : ""}<button data-act="clear" style="color:var(--danger)">Clear ${active}</button>`;
}

document.addEventListener("click", (e) => {
  if (!e.target.closest("#pop, [data-act='switch']")) closeSwitch();
  const t = e.target.closest("[data-tab],[data-act],[data-exp],[data-addsec],[data-remove],[data-pick],[data-unbusy],.ev,[data-q],[data-href]");
  if (!t) { if (selected && mode === "course" && e.target.closest(".gday")) closePanel(); return; }
  const kb = e.detail === 0;
  if (t.dataset.href) location.href = t.dataset.href;
  if (t.dataset.tab) { dismissSwitch(kb); active = t.dataset.tab; sched = { ...SCHEDULES[active] }; preview = null; selected = null; history = []; if (mode === "course" || mode === "alt") closePanel(true); instant = kb; renderAll(); instant = false; toast(`Showing ${active}`); return; }
  if (t.dataset.q) { query = t.dataset.q; expanded = Object.keys(SECTIONS).find((c) => c === t.dataset.q) || null; showPanel("find", { detent: 1 }); return; }
  if (t.dataset.exp) { expanded = expanded === t.dataset.exp ? null : t.dataset.exp; const r = t.closest(".pscroll, .sheet-body"); $("#results", r).innerHTML = resultsHTML(); hydrateIcons($("#results", r)); $(`[data-exp="${t.dataset.exp}"]`, r)?.focus(); return; }
  if (t.dataset.addsec) { const [c, n] = t.dataset.addsec.split("|"); if (sched[c] === n) return; const clash = t.classList.contains("warn"); ghost = null; commit({ ...sched, [c]: n }, `${sched[c] ? "Moved" : "Added"} ${c} §${n}${clash ? ". It overlaps another class." : ""}`); return; }
  if (t.dataset.remove) { const c = t.dataset.remove; const next = { ...sched }; delete next[c]; closePanel(kb); commit(next, `Removed ${c}`); return; }
  if (t.dataset.pick) { const [c, n] = t.dataset.pick.split("|"); if (sched[c] === n) return; commit({ ...sched, [c]: n }, `Moved ${c} to §${n}`); return; }
  if (t.dataset.unbusy) { prefs.busy.splice(+t.dataset.unbusy, 1); showPanel("prefs", { instant: true }); prefsChanged(); return; }
  if (t.classList.contains("ev")) { if (preview) return; const c = t.dataset.code, k = t.dataset.key; if (selected === c && mode === "course") { closePanel(kb); return; } selected = c; renderGrid(); showPanel("course", { code: c, instant: kb, focus: kb, trigger: () => $(`.ev[data-key="${k}"]`) }); return; }
  const a = t.dataset.act;
  if (a === "build") build();
  else if (a === "find") { if (mode === "find" && !PHONE.matches) { $("#q")?.focus(); return; } showPanel("find", { instant: kb, detent: 1 }); }
  else if (a === "prefs") { if (mode === "prefs") closePanel(kb); else showPanel("prefs", { instant: kb, focus: kb }); }
  else if (a === "pclose") closePanel(kb);
  else if (a === "next") showOption((optIndex + 1) % OPTIONS.length, kb);
  else if (a === "altdetail") showPanel("alt", { instant: kb, focus: kb });
  else if (a === "cancelprev") { preview = null; if (mode === "alt") closePanel(true); renderAll(); }
  else if (a === "useopt") { const map = preview ? preview.map : OPTIONS[optIndex].map; const k = optIndex + 1; preview = null; if (mode === "alt") closePanel(true); commit({ ...map }, `Using option ${k}`); }
  else if (a === "saveopt") { const name = ["Short walks", "Fridays free", "Tue and Thu"][optIndex]; SCHEDULES[name] = { ...preview.map }; active = name; sched = SCHEDULES[name]; preview = null; closePanel(true); renderAll(); toast(`Saved as “${name}”`); }
  else if (a === "newsched") { dismissSwitch(kb); const name = "Schedule " + (Object.keys(SCHEDULES).length + 1); SCHEDULES[name] = { ...sched }; active = name; renderAll(); toast(`Copied into “${name}”`); }
  else if (a === "clear") { dismissSwitch(kb); instant = kb; commit({}, `Cleared ${active}`); instant = false; }
  else if (a === "switch") { $("#pop").classList.contains("on") ? closeSwitch(kb) : openSwitch(t, kb); }
  else if (a === "resetprefs") { prefs = { ...DEFAULT_PREFS, busy: [] }; showPanel("prefs", { instant: true }); prefsChanged(); }
  else if (a === "export") openExport();
  else if (a === "copynums") toast("Copied 5 class numbers");
});
/* the popover closes when focus leaves it, so Tab never strands it open */
$("#pop").addEventListener("focusout", (e) => { if (!e.relatedTarget || (!$("#pop").contains(e.relatedTarget) && e.relatedTarget !== popTrigger)) closeSwitch(true); });
/* ghost preview while pointing at a section in search results */
document.addEventListener("pointerover", (e) => { const r = e.target.closest(".results [data-ghost]"); if (!r || !FINE.matches) return; const [code, n] = r.dataset.ghost.split("|"); if (ghost && ghost.code === code && ghost.n === n) return; ghost = { code, n }; renderGrid(); });
document.addEventListener("pointerout", (e) => { if (ghost && e.target.closest(".results") && !e.relatedTarget?.closest?.(".results")) { ghost = null; renderGrid(); } });

/* drag an event: it follows the pointer, then snaps to the nearest section of that course */
let drag = null;
$("#gbody").addEventListener("pointerdown", (e) => { const ev = e.target.closest(".ev"); if (!ev || preview || !FINE.matches) return; drag = { ev, code: ev.dataset.code, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId }; });
addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  if (!drag.moved) { drag.moved = true; selected = drag.code; renderGrid(); drag.ev = $(`.ev[data-key="${drag.ev.dataset.key}"]`); drag.ev.classList.add("dragging"); drag.ev.setPointerCapture?.(drag.id); }
  drag.ev.style.transform = `translate(${dx}px, ${dy}px)`;
  const r = drag.ev.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bd = 1e9; $$(".opt").forEach((o) => { const q = o.getBoundingClientRect(); const d = Math.hypot(q.left + q.width / 2 - cx, q.top + q.height / 2 - cy); o.classList.remove("near"); if (d < bd) { bd = d; best = o; } });
  drag.near = bd < 90 ? best : null; if (drag.near) drag.near.classList.add("near");
});
addEventListener("pointerup", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; if (!d.moved) return;
  if (d.near) { const [c, n] = d.near.dataset.pick.split("|"); d.ev.style.transform = ""; commit({ ...sched, [c]: n }, `Moved ${c} to §${n}`); }
  else { const from = d.ev.style.transform; d.ev.style.transform = ""; if (!reduced()) d.ev.animate([{ transform: from }, { transform: "none" }], { duration: 260, easing: EASE.out }); d.ev.classList.remove("dragging"); }
});
$("#gbody").addEventListener("dblclick", (e) => { if (e.target.classList.contains("gday")) toast("Drag across empty time to block it"); });

/* ---------- export: one set of outputs in both hosts ---------- */
function openExport() {
  const list = Object.entries(sched).map(([c, n]) => ({ c, n, s: secOf(c, n) })).sort((a, b) => a.s.open - b.s.open);
  const html = `<div style="display:flex;align-items:center;margin-bottom:6px"><h2 class="title" id="xtitle">Export ${active}</h2><button class="btn btn-ink btn-icon btn-sm" style="margin-left:auto" data-xclose aria-label="Close">${icon("close")}</button></div>
    <section class="xsec"><h3>${icon("hash")}Class numbers for myUNT</h3><div class="nums">${list.map((x) => `<div><b>${x.s.cls}</b><span>${x.c} §${x.n}</span>${x.s.open < 6 ? "<em>Few seats</em>" : ""}</div>`).join("")}</div><p class="help">Add them to your myUNT cart from the top. The fewest open seats come first.</p><button class="btn btn-primary" data-act="copynums" data-i="copy">Copy all ${list.length}</button></section>
    <section class="xsec"><h3>${icon("calendar")}Calendar file</h3><p class="help">Spring 2027, Jan 19 to May 7. Weekly repeats skip spring break (Mar 15–19). Online classes are left out.</p>${HOST === "untangle" ? `<div class="tline">Leave-by alerts<button class="switch" role="switch" aria-checked="true" aria-label="Leave-by alerts"></button></div>` : ""}<button class="btn btn-secondary" data-i="download">Download .ics</button></section>
    <section class="xsec"><h3>${icon("image")}Picture of the week</h3><button class="btn btn-secondary" data-i="download">Download .png</button></section>
    <section class="xsec"><h3>${icon("share")}Share and back up</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" data-i="copy" data-is="sm">Copy share link</button><button class="btn btn-secondary btn-sm">Print</button><button class="btn btn-secondary btn-sm">Save file</button><button class="btn btn-ink btn-sm">Open a file</button></div></section>`;
  // The same export lands in the phone sheet or the desktop dialog; its switches work in either.
  const wireSwitches = (root) => $$(".switch", root).forEach((s) => (s.onclick = () => s.setAttribute("aria-checked", s.getAttribute("aria-checked") !== "true")));
  if (PHONE.matches) { $("#sbody").innerHTML = `<div style="padding:0 16px">${html}</div>`; hydrateIcons($("#sbody")); wireSwitches($("#sbody")); $("[data-xclose]", $("#sbody")).onclick = () => sheet.close(); sheet.open(1); return; }
  $("#xdialog").innerHTML = html; hydrateIcons($("#xdialog")); wireSwitches($("#xdialog"));
  $("#xwrap").style.display = ""; $("#xscrim").classList.add("on"); requestAnimationFrame(() => $("#xdialog").classList.add("on")); modalOpen($("#xwrap"), $("[data-xclose]", $("#xdialog")));
  $("[data-xclose]", $("#xdialog")).onclick = closeExport;
}
function closeExport() { $("#xdialog").classList.remove("on"); $("#xscrim").classList.remove("on"); modalClose($("#xwrap")); setTimeout(() => ($("#xwrap").style.display = "none"), 150); }
$("#xscrim").onclick = closeExport;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#xwrap").style.display !== "none") closeExport(); else if ($("#pop").classList.contains("on")) closeSwitch(true); else if (PHONE.matches && sheet.index >= 0) closePanel(true); else if (mode) closePanel(true); else if (preview) { preview = null; renderAll(); } }
  if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); undo(true); }
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); showPanel("find", { instant: true, detent: 1 }); }
});

$$(".seg").forEach((s) => (s.id === "views" || s.id === "term") && initSeg(s, (v, b) => { if (b?.dataset.href) location.href = b.dataset.href; }));
addEventListener("resize", () => renderGrid());

/* states */
const st = Q.get("state");
if (st === "conflict") sched = { ...sched, "MATH 3680": "001" };
if (st === "empty") sched = {};
renderAll();
if (st === "choose") { selected = "PHYS 2220"; renderGrid(); showPanel("course", { code: "PHYS 2220", instant: true }); }
if (st === "search") { query = "MATH 3680"; expanded = "MATH 3680"; showPanel("find", { instant: true, detent: 1 }); if (!PHONE.matches) { ghost = { code: "MATH 3680", n: "002" }; renderGrid(); } }
if (st === "options") { preview = { map: OPTIONS[1].map }; optIndex = 1; renderAll(); }
if (st === "optdetail") { preview = { map: OPTIONS[0].map }; optIndex = 0; renderAll(); showPanel("alt", { instant: true }); }
if (st === "prefs") showPanel("prefs", { instant: true });
if (st === "switch") openSwitch($('[data-act="switch"]'), true);
if (st === "export") openExport();
</script>
</body>
