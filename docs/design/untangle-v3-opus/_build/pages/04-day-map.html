<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eeede9">
<title>UNTangle v3: Day</title>
<!--BASE_CSS-->
<style>
  html, body { height: 100%; overflow: hidden; }
  /* The map is the live app's MapLibre map. This mockup shows a capture of it; the separate map
     pass owns the real map, its pins, route styling and camera (../apple-maps-web/). */
  .map { position: fixed; inset: var(--topbar-h) 0 0 0; background: #eceee8 url("assets/live-map.jpg") 62% 40% / cover no-repeat; overflow: hidden; }
  .mapnote { position: absolute; right: 64px; bottom: 10px; z-index: 6; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,.88); font-size: 11px; color: var(--ink-2); pointer-events: none; }

  /* the itinerary column, floating on the map */
  .dpanel { position: fixed; top: calc(var(--topbar-h) + 16px); left: 16px; width: 384px; max-height: calc(100dvh - var(--topbar-h) - 32px); z-index: 10; border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; }
  .dscroll { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 16px; }
  /* day stepper: today first, other days one tap away */
  .daystep { display: flex; align-items: center; gap: 4px; margin: -4px -6px 12px; }
  .daystep b { flex: 1; text-align: center; font-size: 14px; font-weight: 650; }
  .daystep .btn[disabled] { opacity: .3; }
  .hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 12px; padding: 2px 2px 18px; }
  .hero .k { grid-column: 1 / -1; font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .hero .big { font: 700 46px/1 var(--font-mark); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums lining-nums; margin-top: 2px; }
  .hero .big.now { color: var(--brand); }
  .hero .in { justify-self: end; margin-bottom: 6px; display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 13px; font-weight: 650; white-space: nowrap; }
  .hero .in.tight { background: var(--attention-soft); color: var(--attention); }
  .hero .sub { grid-column: 1 / -1; margin-top: 8px; font-size: 14px; color: var(--ink); }
  .itin { --path-gap: 0px; }
  .itin > li { padding-top: 6px; padding-bottom: 6px; }
  .itin > li::before { top: 0; bottom: 0; }
  .itin > li:first-child::before { top: 20px; }
  .itin > li:last-child::before { display: block; bottom: auto; height: 20px; }
  .itin .stop { top: 8px; z-index: 1; }
  .itin .stop.ring { width: 22px; height: 22px; left: 5px; top: 11px; }
  .stopbtn { display: block; width: 100%; text-align: left; padding: 6px 8px; margin: -4px -8px; border-radius: 10px; transition: background-color var(--t-hover) ease; }
  .stopbtn[aria-expanded="true"] { background: rgba(0,168,85,.12); }
  .stopmore { padding: 6px 0 2px; }
  @media (hover: hover) and (pointer: fine) { .stopbtn:hover:not([aria-expanded="true"]) { background: rgba(26,46,26,.05); } }
  .stopbtn .l1 { display: flex; align-items: center; gap: 10px; min-height: 24px; }
  .stopbtn .code { font-size: 14px; } .stopbtn .plate { margin-left: auto; } .stopbtn .tm { font-size: 14px; color: var(--ink); min-width: 38px; text-align: right; }
  .more { display: grid; gap: 2px; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
  .legmore { margin: 0 0 4px 24px; }
  .more a { font-weight: 600; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
  .leg { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; text-align: left; font-size: 13px; color: var(--ink-2); padding: 0 8px; margin: 0 -8px; border-radius: 10px; }
  .leg .i { width: 16px; height: 16px; color: var(--ink-3); }
  .leg b { color: var(--ink); font-weight: 650; }
  .leg .tl { margin-left: auto; white-space: nowrap; font-weight: 650; }
  .leg.tight .tl, .leg.tight .i { color: var(--attention); }
  .leg.late .tl, .leg.late .i { color: var(--danger); }
  .leg.next b { color: var(--brand); }
  .itin li[data-kind="leg"] { padding-left: 44px; }
  .itin li.pastrow { opacity: .62; }

  .tabbar { z-index: 70; }
  @media (pointer: coarse) { .leg, .stopbtn { min-height: 44px; } .daystep .btn { width: 44px; } }
  @media (max-width: 759px) {
    .map { inset: 0; background-position: 30% 30%; }
    .mapnote { right: auto; left: 10px; bottom: auto; top: calc(var(--safe-t) + 60px); font-size: 10px; }
    .dpanel { display: none; }
    .ptop { position: fixed; z-index: 12; left: 10px; right: 10px; top: calc(10px + var(--safe-t)); display: flex; gap: 8px; align-items: center; }
    .ptop #pdays { flex: 1; border-radius: 14px; padding: 2px 6px; } .ptop .daystep { margin: 0; }
    .sheet.glass .dscroll { padding: 0 16px 24px; }
    .hero .big { font-size: 44px; }
  }
</style>
</head>
<body>
<header class="topbar only-desk">
  <span class="wordmark">UNTangle</span>
  <nav class="seg" id="views" aria-label="Views"><button type="button" data-href="02-courses.html?state=after&quiet=1">Courses</button><button type="button" data-href="03-schedule-builder.html">Week</button><button type="button" aria-pressed="true">Day</button></nav>
  <button class="search" type="button" data-i="search"><span>Search buildings or courses</span><kbd class="kbd">⌘K</kbd></button>
  <a class="sched-pill" href="05-schedules-library.html" aria-label="Schedule: Spring 2027, Main. Switch schedule"><span class="dot"></span><span class="when">Spring 2027</span>Main</a>
  <a class="avatar" href="06-sign-in.html" aria-label="Account">SG</a>
</header>

<div class="map" id="map" role="img" aria-label="Static UNT campus map capture from another sample day, with a green route past the General Academic Building"><span class="mapnote">Capture of the live map, from another sample day</span></div>

<aside class="dpanel glass-panel" aria-label="Your day"><div class="dscroll" id="panelBody"></div></aside>
<div class="ptop only-phone"><div class="glass-panel" id="pdays"></div></div>
<section class="sheet glass only-phone" id="sheet" aria-label="Your day"><div class="grabber"></div><div class="sheet-body"><div class="dscroll" id="sheetBody"></div></div></section>
<nav class="tabbar only-phone" aria-label="Views"><a href="02-courses.html?state=after&quiet=1" data-i="courses">Courses</a><a href="03-schedule-builder.html" data-i="week">Week</a><a aria-current="page" href="04-day-map.html" data-i="day">Day</a></nav>
<div class="sr" aria-live="polite" id="live"></div>

<!--BASE_JS-->
<script>
/* ---------- the day, from the Main schedule ---------- */
const BLD = { KERR: "Kerr Hall", GAB: "GAB", CURY: "CURY", PHYS: "PHYS", ESSC: "ESSC" };
const LEGS = { "KERR>GAB": 9, "GAB>CURY": 4, "CURY>PHYS": 8, "KERR>ESSC": 7 };
const C = { "CSCE 2110": ["Foundations of Data Structures", "GAB", "535"], "MATH 2700": ["Linear Algebra", "CURY", "202"], "PHYS 2220": ["Electricity and Magnetism", "PHYS", "104"], "CSCE 2610": ["Assembly Language", "ESSC", "255"] };
const M = (h, m) => h + m / 60; // exact clock times, so "leave at class end" compares equal
const MWF = [["CSCE 2110", M(9, 0), M(9, 50)], ["MATH 2700", M(10, 0), M(10, 50)], ["PHYS 2220", M(11, 0), M(11, 50)]];
const DAYS = { 0: MWF, 1: [["CSCE 2610", M(12, 30), M(13, 50)]], 2: MWF, 3: [["CSCE 2610", M(12, 30), M(13, 50)]], 4: MWF.slice(0, 2) };
const DNAME = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const BUFFER = 2; // minutes kept between arriving and class start; a placeholder (untangle-v3.md)
const fmt = (h) => { const m = Math.round(h * 60); const hh = Math.floor(m / 60), mm = m % 60; return `${hh > 12 ? hh - 12 : hh}:${String(mm).padStart(2, "0")}`; };
const nowParam = Q.get("now") || "0837"; const NOW = +nowParam.slice(0, 2) + +nowParam.slice(2) / 60;
const TODAY = +(Q.get("today") ?? 0);
let day = +(Q.get("day") ?? TODAY);
let selStop = null, selLeg = null;

function plan(d) {
  const cls = DAYS[d] || []; let from = "KERR", prevEnd = null; const items = [];
  cls.forEach(([code, s, e], i) => {
    const to = C[code][1]; const min = LEGS[`${from}>${to}`] ?? 6;
    const leave = s - (min + BUFFER) / 60;
    const late = prevEnd !== null && s - min / 60 < prevEnd - 1e-6;
    const tight = !late && prevEnd !== null && leave <= prevEnd + 1e-6;
    items.push({ kind: "leg", id: `${from}>${to}`, from, to, min, leave: prevEnd !== null ? Math.max(leave, prevEnd) : leave, tight, late, first: i === 0 });
    items.push({ kind: "stop", n: i + 1, code, s, e, b: to });
    from = to; prevEnd = e;
  });
  return items;
}
/* the hero answers three things: next class, where, and when to leave */
function heroFor(d) {
  const items = plan(d); const stops = items.filter((x) => x.kind === "stop"); const legs = items.filter((x) => x.kind === "leg");
  const where = (st) => `${st.code} starts at ${fmt(st.s)} in ${st.b} ${C[st.code][2]}.`;
  if (!stops.length) return { k: `No classes ${DNAME[d]}`, big: "Free", sub: "Your next class is Monday at 9:00 in GAB." };
  if (d !== TODAY) return { k: `On ${DNAME[d]}, leave Kerr Hall by`, big: fmt(legs[0].leave), sub: where(stops[0]), leg: legs[0] };
  for (let i = 0; i < stops.length; i++) {
    const l = legs[i], st = stops[i];
    if (NOW < st.s) {
      const mins = Math.round((l.leave - NOW) * 60);
      if (mins <= 1) return { k: `Head to ${st.b} now`, big: "Leave now", now: true, chip: `${l.min} min walk`, sub: where(st), leg: l, tight: l.tight };
      return { k: `Leave ${BLD[l.from]} by`, big: fmt(l.leave), chip: l.tight || l.late ? "Right as class ends" : `in ${mins} min`, tight: l.tight || l.late, sub: where(st), leg: l };
    }
    if (NOW < st.e && i === stops.length - 1) return { k: `In ${st.code} until ${fmt(st.e)}`, big: "Last one", sub: "Nothing after this today." };
  }
  return { k: "Done for today", big: "That's it", sub: "Tomorrow, CSCE 2610 starts at 12:30 in ESSC 255." };
}

/* ---------- itinerary: stops carry time and building; walks carry minutes unless tight or late ---------- */
function panelHTML(withDays) {
  const items = plan(day); const h = heroFor(day);
  const isPast = (it) => day === TODAY && (it.kind === "stop" ? NOW >= it.e : NOW > it.leave + it.min / 60);
  const legRow = (it) => {
    const note = it.late ? `${it.min - Math.round((items[items.indexOf(it) + 1].s - it.leave) * 60)} min late` : it.tight ? `Leave right at ${fmt(it.leave)}` : "";
    return `<li data-kind="leg" class="${isPast(it) ? "pastrow" : ""}" data-leg="${isPast(it) ? "past" : ""}">${it.first ? '<span class="stop ring" aria-hidden="true"></span>' : ""}<button class="leg ${it.late ? "late" : it.tight ? "tight" : ""} ${h.leg === it ? "next" : ""}" data-legid="${it.id}" aria-pressed="${selLeg === it.id}" aria-label="${it.min} minute walk${it.first ? " from Kerr Hall" : ""}${note ? ", " + note : ""}">${icon("walk")}<span><b>${it.min} min</b></span>${note ? `<span class="tl">${note}</span>` : ""}</button>${selLeg === it.id ? `<div class="more legmore"><span>Leave by ${fmt(it.leave)}${it.first ? " from Kerr Hall" : `, ${Math.round((items[items.indexOf(it) + 1].s - items[items.indexOf(it) - 1].e) * 60)} min break`}</span>${it.first ? '<a href="#" onclick="event.preventDefault()">Change starting point</a>' : ""}</div>` : ""}</li>`;
  };
  const stopRow = (it) => `<li data-kind="stop" class="${isPast(it) ? "pastrow" : ""}" data-leg="${isPast(it) ? "past" : ""}"><span class="stop ${isPast(it) ? "past" : ""}">${it.n}</span><button class="stopbtn" data-stop="${it.n}" aria-expanded="${selStop === it.n}"><div class="l1"><span class="code">${it.code}</span><span class="plate"><b>${it.b}</b></span><span class="tm">${fmt(it.s)}</span></div></button>${selStop === it.n ? `<div class="more stopmore"><span>${C[it.code][0]}</span><span>Room ${C[it.code][2]}, until ${fmt(it.e)}</span><a href="#" onclick="event.preventDefault()">Directions in Google Maps${icon("ext", "sm")}</a></div>` : ""}</li>`;
  return `${withDays ? stepHTML() : ""}
    <div class="hero" aria-live="polite"><span class="k">${h.k}</span><span class="big ${h.now ? "now" : ""}">${h.big}</span>${h.chip ? `<span class="in ${h.tight ? "tight" : ""}">${h.chip}</span>` : "<span></span>"}<span class="sub">${h.sub}</span></div>
    ${items.length ? `<ol class="path itin">
      ${items.map((it) => (it.kind === "leg" ? legRow(it) : stopRow(it))).join("")}
    </ol>` : ""}`;
}
function stepHTML() {
  return `<div class="daystep" role="group" aria-label="Day"><button class="btn btn-ink btn-icon btn-sm" data-step="-1" aria-label="Previous day" ${day === 0 ? "disabled" : ""}>${icon("chevL")}</button><b aria-live="polite">${day === TODAY ? "Today" : DNAME[day]}</b><button class="btn btn-ink btn-icon btn-sm" data-step="1" aria-label="Next day" ${day === 4 ? "disabled" : ""}>${icon("chevR")}</button></div>`;
}
function renderPanels() {
  $("#panelBody").innerHTML = panelHTML(true);
  $("#sheetBody").innerHTML = panelHTML(false);
  hydrateIcons($("#panelBody")); hydrateIcons($("#sheetBody"));
}
/* Selecting rebuilds the itinerary, which would drop focus on the body. Put it back on the same
   stop or walk in the same panel, so the keyboard keeps its place. */
function renderKeepingFocus() {
  const a = document.activeElement, host = a?.closest?.("#panelBody, #sheetBody");
  const key = a?.dataset?.stop ? `[data-stop="${a.dataset.stop}"]` : a?.dataset?.legid ? `[data-legid="${a.dataset.legid}"]` : null;
  renderPanels();
  if (host && key) $(`#${host.id} ${key}`)?.focus({ preventScroll: true });
}
function setDay(d) { if (d === day || d < 0 || d > 4) return; day = d; selStop = null; selLeg = null; renderPanels(); syncPhoneDays(); }
function selectStop(n) {
  selStop = selStop === n ? null : n; selLeg = null; renderKeepingFocus();
  if (PHONE.matches && sheet.index === 2) sheet.snap(1);
  const st = plan(day).find((x) => x.kind === "stop" && x.n === n);
  $("#live").textContent = selStop ? `${st.code} in ${st.b} selected` : "";
}
function selectLeg(id) { selLeg = selLeg === id ? null : id; selStop = null; renderKeepingFocus(); }

/* ---------- phone sheet and day switcher ---------- */
const sheet = new Sheet($("#sheet"), { detents: [() => 206, () => Math.max(320, innerHeight * 0.5), () => innerHeight * 0.86], bottomInset: () => (PHONE.matches ? 56 : 0) });
function syncPhoneDays() { const el = $("#pdays"); el.innerHTML = stepHTML(); hydrateIcons(el); }

document.addEventListener("click", (e) => {
  const step = e.target.closest("[data-step]");
  if (step) { const where = step.closest("#pdays") ? "#pdays" : "#panelBody", dir = step.dataset.step; setDay(day + +dir); const same = $(`${where} [data-step="${dir}"]`); (same && !same.disabled ? same : $(`${where} [data-step="${-dir}"]`))?.focus(); return; }
  const s = e.target.closest("[data-stop]"), l = e.target.closest("[data-legid]"), v = e.target.closest("[data-href]");
  if (s) return selectStop(+s.dataset.stop);
  if (l) return selectLeg(l.dataset.legid);
  if (v) location.href = v.dataset.href;
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (selStop || selLeg)) { selStop = selLeg = null; renderKeepingFocus(); } });
$$(".seg").forEach((s) => s.id === "views" && initSeg(s, (v, b) => b?.dataset.href && (location.href = b.dataset.href)));

renderPanels(); syncPhoneDays();
if (PHONE.matches) sheet.open(Q.get("detent") ? +Q.get("detent") : 0); else sheet.el.style.display = "none";
if (Q.get("stop")) selectStop(+Q.get("stop"));
if (Q.get("leg")) selectLeg(Q.get("leg"));
</script>
</body>
</html>
