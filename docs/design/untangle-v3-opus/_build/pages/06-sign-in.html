<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f3">
<title>UNTangle v3: Sign in</title>
<!--BASE_CSS-->
<style>
  /* a quiet stand-in for whatever screen the student was on */
  .behind { position: fixed; inset: 0; pointer-events: none; }
  .behind .fake { max-width: 760px; margin: 32px auto; padding: 0 24px; display: grid; gap: 12px; }
  .behind .fake i { display: block; height: 52px; border-radius: 12px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .behind .fake i.big { height: 220px; }
  .form { padding: 26px 26px 22px; display: grid; gap: 16px; }
  .form .top { display: flex; align-items: center; }
  .form .top .close { margin-left: auto; margin-right: -8px; }
  .form h1 { font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -.012em; }
  .form .lede { font-size: 14px; line-height: 20px; color: var(--ink-2); margin-top: -8px; }
  .lrow { display: flex; align-items: baseline; justify-content: space-between; }
  .pw { position: relative; }
  .pw .input { padding-right: 64px; }
  .pw .show { position: absolute; right: 4px; top: 4px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--brand-2); }
  .helpslot { min-height: 18px; }
  .submit { width: 100%; height: 48px; font-size: 15px; border-radius: 12px; margin-top: 2px; }
  .alts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: -6px; }
  .foot { font-size: 12.5px; color: var(--ink-2); text-align: center; border-top: 1px solid var(--line); padding-top: 14px; }
  @media (max-width: 759px) {
    .dialog-wrap { display: none !important; }
    .sheet .form { padding: 4px 20px calc(24px + var(--safe-b)); }
  }
  @media (min-width: 760px) { .sheet { display: none; } }
</style>
</head>
<body>
<div class="behind" aria-hidden="true">
  <header class="topbar only-desk"><span class="wordmark">UNTangle</span><span></span><span></span><span></span><span class="btn btn-ink btn-sm">Sign in</span></header>
  <header class="pheader only-phone"><span class="wordmark">UNTangle</span></header>
  <div class="fake"><i class="big"></i><i></i><i></i><i></i><i></i></div>
</div>
<div class="scrim on" id="scrim"></div>
<div class="dialog-wrap"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="t-desk" id="dlg"></div></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="t-phone"><div class="grabber"></div><div class="sheet-body" id="sbody"></div></section>

<!--BASE_JS-->
<script>
/* Magic link first, password second (untangle-v3.md, Decisions). The views and copy follow the
   shipped /auth (frontend/src/components/auth-client.tsx): link, sent, password. A new student
   needs no separate sign-up; the first link creates the account. */
const st = Q.get("state");
let view = st === "sent" ? "sent" : st === "password" || st === "error" ? "password" : "link";
let email = st === "error" || st === "loading" || st === "sent" ? "sam.gu@my.unt.edu" : st === "bademail" ? "sam.gu@my" : "";
const UNT = /^[^\s@]+@(my\.)?unt\.edu$/i;
const EMAIL_RULE = "Use a UNT email address ending in @unt.edu or @my.unt.edu.";
// Keyboard actions never animate (DESIGN.md §1), so remember how the last action came in.
let viaKeyboard = false;
addEventListener("keydown", () => (viaKeyboard = true), true);
addEventListener("pointerdown", () => (viaKeyboard = false), true);
const esc = (v) => v.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

function emailField(sfx, err) {
  return `<div class="field"><label for="em-${sfx}">UNT email</label><input class="input" id="em-${sfx}" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="eagleid@my.unt.edu" value="${esc(email)}"${err ? ` aria-invalid="true" aria-describedby="eh-${sfx}"` : ""}>
    ${err ? `<p class="help err" id="eh-${sfx}">${err}</p>` : ""}</div>`;
}
function formHTML(sfx) {
  const top = `<div class="top"><span class="wordmark" style="font-size:18px">UNTangle</span><button type="button" class="btn btn-ink btn-icon btn-sm close" aria-label="Close" data-close>${icon("close")}</button></div>`;
  const foot = `<p class="foot">You can use UNTangle without an account. Signing in only syncs.</p>`;
  const badEmail = st === "bademail" ? EMAIL_RULE : "";
  if (view === "sent") return `<div class="form" data-form>${top}
    <h1 id="t-${sfx}" tabindex="-1">Check your UNT email</h1>
    <p class="lede" role="status">We sent a sign-in link to <b>${esc(email)}</b>. It works once and expires in 5 minutes.</p>
    <button class="btn btn-secondary submit" type="button" data-resend>Resend link</button>
    <div class="alts"><button type="button" class="btn btn-quiet" data-view="link">Use a different email</button><button type="button" class="btn btn-quiet" data-view="password">Use a password instead</button></div>
    ${foot}</div>`;
  if (view === "password") return `<form class="form" novalidate data-form>${top}
    <h1 id="t-${sfx}" tabindex="-1">Sign in with a password</h1>
    <p class="lede">For accounts that have set a password. New here, or never set one? Email yourself a sign-in link.</p>
    ${emailField(sfx, badEmail)}
    <div class="field"><div class="lrow"><label for="pw-${sfx}">Password</label><a href="#" class="meta" style="font-weight:600;color:var(--brand-2)">Forgot it?</a></div>
      <div class="pw"><input class="input" id="pw-${sfx}" type="password" autocomplete="current-password" ${st === "error" ? 'aria-invalid="true" value="hunter22"' : st === "loading" ? 'value="correct-horse"' : ""} aria-describedby="ph-${sfx}"><button type="button" class="show" data-show>Show</button></div>
      <p class="help helpslot ${st === "error" ? "err" : ""}" id="ph-${sfx}">${st === "error" ? "That password doesn't match this email. Try again, or reset it." : ""}</p></div>
    <button class="btn btn-primary submit" type="submit" data-submit>Sign in</button>
    <div class="alts"><button type="button" class="btn btn-quiet" data-view="link">Email me a link instead</button></div>
    ${foot}</form>`;
  return `<form class="form" novalidate data-form>${top}
    <h1 id="t-${sfx}" tabindex="-1">Sign in</h1>
    <p class="lede">Keep your schedules on every device. What you made as a guest comes with you. We'll email you a sign-in link. No password needed.</p>
    ${emailField(sfx, badEmail)}
    <button class="btn btn-primary submit" type="submit" data-submit>Email me a sign-in link</button>
    <div class="alts"><button type="button" class="btn btn-quiet" data-view="password">Use a password instead</button></div>
    ${foot}</form>`;
}
const host = () => (PHONE.matches ? $("#sbody") : $("#dlg"));
function render() { $("#dlg").innerHTML = formHTML("desk"); $("#sbody").innerHTML = formHTML("phone"); wire(); }
/* A view change crossfades the form (swap) and moves focus to the new heading, as the live page does. */
let viewToken = 0;
function goTo(next, fromKeyboard = viaKeyboard) {
  const f = $("[data-form]", host()); const em = f && $("input[type=email]", f); if (em) email = em.value;
  view = next;
  // A second change while the first is still fading wins; the first one's render is dropped.
  const token = ++viewToken;
  const done = () => { if (token !== viewToken) return; render(); $("h1", host())?.focus({ preventScroll: true }); };
  host().getAnimations().forEach((a) => a.cancel());
  if (fromKeyboard) done(); else swap(host(), done);
}
function busy(btn, label) { btn.style.width = btn.offsetWidth + "px"; btn.innerHTML = `<span class="spin"></span><span class="sr">${label}</span>`; btn.disabled = true; }
function wire() {
  $$("[data-show]").forEach((b) => (b.onclick = () => { const i = b.previousElementSibling; const on = i.type === "password"; i.type = on ? "text" : "password"; b.textContent = on ? "Hide" : "Show"; }));
  $$("[data-view]").forEach((b) => (b.onclick = () => goTo(b.dataset.view)));
  $$("[data-resend]").forEach((b) => (b.onclick = () => toast("Sent another link")));
  $$("form[data-form]").forEach((f) => (f.onsubmit = (e) => {
    e.preventDefault(); const em = $("input[type=email]", f), btn = $("[data-submit]", f);
    const errId = "x-" + em.id;
    if (!UNT.test(em.value.trim())) {
      // The message is tied to the field (aria-describedby) as well as shown, so a screen reader reads why.
      em.setAttribute("aria-invalid", "true"); $("#eh-" + em.id.slice(3))?.remove();
      if (!$("#" + errId)) em.insertAdjacentHTML("afterend", `<p class="help err" id="${errId}">${EMAIL_RULE}</p>`);
      em.setAttribute("aria-describedby", errId); em.focus(); return;
    }
    em.removeAttribute("aria-invalid"); em.removeAttribute("aria-describedby"); $("#" + errId)?.remove(); $("#eh-" + em.id.slice(3))?.remove();
    email = em.value.trim();
    if (view === "link") { busy(btn, "Sending"); setTimeout(() => goTo("sent"), 600); return; }
    const pw = $(".pw .input", f);
    busy(btn, "Signing in");
    setTimeout(() => {
      if (pw.value.length < 8) { btn.disabled = false; btn.style.width = ""; btn.textContent = "Sign in"; pw.setAttribute("aria-invalid", "true"); const h = $(".helpslot", f); h.classList.add("err"); h.textContent = "That password doesn't match this email. Try again, or reset it."; pw.focus(); return; }
      close(); toast("Signed in. 3 schedules synced.");
    }, 700);
  }));
  $$("[data-close]").forEach((b) => (b.onclick = close));
}
const sheet = new Sheet($("#sheet"), { detents: [() => innerHeight * 0.92], modal: true, scrim: $("#scrim"), dismissible: true });
function close() { $("#dlg").classList.remove("on"); $("#scrim").classList.remove("on"); if (PHONE.matches) sheet.close(); else { modalClose($(".dialog-wrap")); setTimeout(() => ($(".dialog-wrap").style.display = "none"), 150); } }
document.addEventListener("keydown", (e) => e.key === "Escape" && close());
$("#scrim").onclick = close;
render();
const first = () => $(view === "sent" ? "[data-resend]" : "input[type=email]", host());
if (PHONE.matches) sheet.open(0); else { requestAnimationFrame(() => requestAnimationFrame(() => $("#dlg").classList.add("on"))); modalOpen($(".dialog-wrap"), first()); }
if (st === "loading") { const f = $("[data-form]", host()); busy($("[data-submit]", f), view === "link" ? "Sending" : "Signing in"); }
</script>
</body>
</html>
