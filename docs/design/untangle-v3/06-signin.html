<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNTangle v3 · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f3f5f1;--surface:#fff;--surface-2:#edf1ec;--line:#dbe4da;--line-strong:#c2d0c2;--ink:#1a2e1a;--ink-2:#586e58;--ink-3:#6f836d;--ink-4:#9aab99;--brand:#00512b;--brand-hover:#00703a;--brand-soft:#e3efe6;--accent:#00a855;--danger:#b3261e;--font-body:"DM Sans",system-ui,sans-serif;--font-display:"Syne",sans-serif;--shadow-2:0 4px 12px rgba(26,46,26,.08),0 1px 2px rgba(26,46,26,.06);--focus:0 0 0 2px var(--surface),0 0 0 4px var(--accent);--ease-out:cubic-bezier(.23,1,.32,1);--t-press:120ms;--t-hover:160ms}
html,body{height:100%}
body{font:14px/20px var(--font-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:var(--brand);text-decoration:none;font-weight:600}
.wordmark{font:800 22px/1 var(--font-display);color:var(--brand);letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;font-weight:600;font-size:15px;width:100%;transition:transform var(--t-press) var(--ease-out),background-color var(--t-hover) ease}
.btn:active{transform:scale(.97)}.btn:focus-visible{outline:0;box-shadow:var(--focus)}
.btn-primary{background:var(--brand);color:#fff}.btn-ghost{background:var(--surface);border:1px solid var(--line-strong)}
@media(hover:hover) and (pointer:fine){.btn-primary:hover{background:var(--brand-hover)}.btn-ghost:hover{background:var(--surface-2)}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.top{width:100%;max-width:400px;margin-bottom:20px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-2);padding:28px}
h1{font-size:18px;line-height:24px;font-weight:600}
.lede{color:var(--ink-2);margin-top:4px}
.f{margin-top:18px}
.f label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.f input{width:100%;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);outline:0;transition:border-color var(--t-hover) ease}
.f input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.f .help{font-size:12.5px;line-height:18px;color:var(--danger);margin-top:4px;display:none}
.f.err input{border-color:var(--danger)}.f.err .help{display:block}
.f .row{display:flex;justify-content:space-between;align-items:baseline}
.f .row a{font-size:12.5px}
.acts{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.below{width:100%;max-width:400px;margin-top:16px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.dev{position:fixed;left:16px;bottom:16px;display:flex;gap:6px;align-items:center;background:#1a2e1a;color:#fff;padding:6px 8px;border-radius:999px;font-size:11px;z-index:60}
.dev b{opacity:.6;margin:0 4px}.dev button{color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 8px;font-size:11px}
@media (max-width:719px){
  main{justify-content:flex-start;padding:calc(24px + env(safe-area-inset-top)) 20px 40px}
  .card{border:0;box-shadow:none;background:none;padding:0;max-width:none}
  .top{max-width:none}
  .f input{font-size:16px;height:44px}
  .below{max-width:none}
  .dev{left:8px;right:8px}
}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<main>
  <div class="top"><span class="wordmark">UNTangle</span></div>
  <form class="card" id="form" novalidate>
    <h1>Sign in</h1>
    <p class="lede">Your schedules save to your account and follow you between phone and laptop.</p>
    <div class="f" id="f-email"><label for="email">UNT email</label><input id="email" type="email" inputmode="email" autocomplete="username" placeholder="eagleid@my.unt.edu"><p class="help">Use your @unt.edu or @my.unt.edu address.</p></div>
    <div class="f" id="f-pass"><div class="row"><label for="pass">Password</label><a href="#">Forgot password?</a></div><input id="pass" type="password" autocomplete="current-password"><p class="help">That password doesn't match this email.</p></div>
    <div class="acts">
      <button class="btn btn-primary" id="go" type="submit">Sign in</button>
      <button class="btn btn-ghost" type="button">Continue as guest</button>
    </div>
  </form>
  <div class="below"><span>New here? <a href="#">Create account</a></span><a href="#">Back to courses</a></div>
</main>
<div class="dev"><b>states</b><button data-go="idle">idle</button><button data-go="email">email error</button><button data-go="pass">password error</button><button data-go="busy">signing in</button></div>
<script>
const go=document.getElementById('go');
function set(s){document.querySelectorAll('.f').forEach(f=>f.classList.remove('err'));go.disabled=false;go.textContent='Sign in';
  if(s==='email'){document.getElementById('f-email').classList.add('err');document.getElementById('email').focus()}
  if(s==='pass'){document.getElementById('f-pass').classList.add('err');document.getElementById('pass').focus()}
  if(s==='busy'){go.disabled=true;go.innerHTML='<span class="spin"></span>Signing in…';setTimeout(()=>set('idle'),1400)}}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const em=document.getElementById('email').value;if(!/@(my\.)?unt\.edu$/.test(em)){set('email');return}set('busy')};
document.querySelectorAll('.dev [data-go]').forEach(b=>b.onclick=()=>set(b.dataset.go));
</script>
</body>
</html>
